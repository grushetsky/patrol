[tools]
harper-cli = "3.0.0"
hk = "2.11.0"
miniserve = "0.35.0"
shellcheck = "0.11.0"
taplo = "0.10.0"

[tasks.app]
description = "Run the service prototype at http://localhost:4173"
dir = "prototype"
run = "miniserve --interfaces 127.0.0.1 --port 4173 --index index.html ."

[tasks.pitch]
description = "Run the pitch deck at http://localhost:4174"
dir = "prototype"
run = "miniserve --interfaces 127.0.0.1 --port 4174 --index pitch.html ."
