<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="app.title">Patrol · service prototype</title>
    <meta name="description" content="Clickable prototype of Patrol: discovery, review, evidence, and notices for one rights holder." />
    <link rel="stylesheet" href="assets/pico.min.css" />
    <link rel="stylesheet" href="assets/theme.css" />
    <link rel="stylesheet" href="assets/app.css" />
  </head>
  <body>
    <!-- Prototype state lives in memory only. Reset from the footer. -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none" aria-hidden="true">
      <symbol id="i-shield" viewBox="0 0 24 24">
        <path d="M12 2.8 19 5.8v5.4c0 4.4-2.9 7.7-7 9.4-4.1-1.7-7-5-7-9.4V5.8l7-3Z" />
        <path d="m8.8 12.1 2.2 2.2 4.2-4.4" />
      </symbol>
      <symbol id="i-siren" viewBox="0 0 24 24">
        <path d="M7 18v-4.6a5 5 0 0 1 10 0V18" />
        <path d="M4.4 18h15.2" />
        <path d="M12 3v2.1" />
        <path d="m5.1 6.1 1.5 1.5" />
        <path d="m18.9 6.1-1.5 1.5" />
      </symbol>
      <symbol id="i-radar" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8.6" />
        <circle cx="12" cy="12" r="4.6" />
        <path d="M12 12 17.6 6.4" />
        <circle cx="15.4" cy="14.8" r=".9" fill="currentColor" stroke="none" />
      </symbol>
      <symbol id="i-film" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="14" rx="2" />
        <path d="M8 5v14M16 5v14" />
        <path d="M3 10h5M3 14h5M16 10h5M16 14h5" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="m5 12.6 4.4 4.4L19 7" />
      </symbol>
      <symbol id="i-x" viewBox="0 0 24 24">
        <path d="M6 6l12 12M18 6 6 18" />
      </symbol>
      <symbol id="i-lock" viewBox="0 0 24 24">
        <rect x="5" y="10" width="14" height="10" rx="2" />
        <path d="M8.5 10V7.6a3.5 3.5 0 0 1 7 0V10" />
      </symbol>
      <symbol id="i-file" viewBox="0 0 24 24">
        <path d="M6 3h8l4 4v14H6z" />
        <path d="M14 3v4h4" />
        <path d="M9 13h6M9 17h6M9 9h2" />
      </symbol>
      <symbol id="i-send" viewBox="0 0 24 24">
        <path d="M21 4 3 11l7 2 2 7 9-16Z" />
        <path d="m10 13 5-5" />
      </symbol>
      <symbol id="i-play" viewBox="0 0 24 24">
        <path d="M8 5.5v13l11-6.5-11-6.5Z" />
      </symbol>
      <symbol id="i-pause" viewBox="0 0 24 24">
        <path d="M9 5v14M15 5v14" />
      </symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24">
        <path d="M4 12h15M13 6l6 6-6 6" />
      </symbol>
      <symbol id="i-eye" viewBox="0 0 24 24">
        <path d="M2.5 12S6 6.5 12 6.5 21.5 12 21.5 12 18 17.5 12 17.5 2.5 12 2.5 12Z" />
        <circle cx="12" cy="12" r="3" />
      </symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24">
        <path d="M20 11a8 8 0 1 0-2.3 5.7" />
        <path d="M20 5v6h-6" />
      </symbol>
      <symbol id="i-bolt" viewBox="0 0 24 24">
        <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" />
      </symbol>
      <symbol id="i-globe" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M3 12h18" />
        <path d="M12 3c2.5 2.6 3.8 5.7 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3Z" />
      </symbol>
      <symbol id="i-link" viewBox="0 0 24 24">
        <path d="M10.5 13.5a4 4 0 0 0 5.7 0l2.3-2.3a4 4 0 0 0-5.7-5.7l-1.3 1.3" />
        <path d="M13.5 10.5a4 4 0 0 0-5.7 0l-2.3 2.3a4 4 0 0 0 5.7 5.7l1.3-1.3" />
      </symbol>
      <symbol id="i-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 7v5l3 2" />
      </symbol>
      <symbol id="i-gauge" viewBox="0 0 24 24">
        <path d="M4 18a8 8 0 1 1 16 0" />
        <path d="m12 14 4-4" />
        <circle cx="12" cy="18" r="1.2" fill="currentColor" stroke="none" />
      </symbol>
    </svg>

    <div class="scan-line" id="scan-line" aria-hidden="true"></div>

    <header class="topbar">
      <a class="brand" href="#/dashboard" aria-label="Patrol dashboard" data-i18n-aria-label="app.brand.dashboard">
        <span class="brand-mark"><svg class="icon"><use href="#i-shield" /></svg></span>
        <span class="brand-text">
          <span class="brand-name">Patrol</span>
          <span class="brand-sub" data-i18n="app.brand.sub">Rights watch</span>
        </span>
      </a>

      <span class="lightbar" aria-hidden="true">
        <span class="light light--blue"></span>
        <span class="light light--red"></span>
      </span>

      <nav class="tabs" id="tabs" aria-label="Sections"></nav>

      <div class="topbar-actions">
        <div class="lang-switch" role="group" data-i18n-aria-label="lang.label">
          <button type="button" data-lang="en" aria-pressed="false" aria-label="English" lang="en">EN</button>
          <button type="button" data-lang="ru" aria-pressed="false" aria-label="Русский" lang="ru">RU</button>
        </div>
        <button class="btn btn-ghost btn-icon" id="siren-toggle" type="button" aria-pressed="false" aria-label="Toggle siren mode" title="Siren mode" data-i18n-aria-label="app.siren.toggle" data-i18n-title="app.siren.title">
          <svg class="icon"><use href="#i-siren" /></svg>
        </button>
        <button class="btn btn-primary btn-sm" id="scan-btn" type="button" data-action="scan">
          <svg class="icon icon--sm"><use href="#i-radar" /></svg>
          <span data-i18n="app.scan.run">Run scans</span>
        </button>
      </div>
    </header>

    <main id="view" aria-live="polite"></main>

    <footer class="foot">
      <span><span data-i18n="app.footer.rights">Northlight Pictures</span> · <span data-i18n="app.footer.prototype">prototype</span> · <span data-i18n="app.footer.resetNote">state resets on reload</span> · <a href="./pitch.html" data-i18n="app.footer.pitch">pitch deck</a></span>
      <button type="button" data-action="reset" data-i18n="app.footer.reset">Reset demo</button>
    </footer>

    <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

    <dialog id="modal" aria-labelledby="modal-title">
      <article class="modal-card">
        <div class="modal-head">
          <span id="modal-title" data-i18n="app.modal.detail">Detail</span>
          <button type="button" data-action="close-modal" aria-label="Close" data-i18n-aria-label="app.modal.close">
            <svg class="icon icon--sm"><use href="#i-x" /></svg>
          </button>
        </div>
        <div class="modal-body" id="modal-body"></div>
      </article>
    </dialog>

    <noscript><p style="padding: 20px">This prototype needs JavaScript.</p></noscript>
    <script src="assets/i18n.js"></script>
    <script src="assets/app.js"></script>
  </body>
</html>
