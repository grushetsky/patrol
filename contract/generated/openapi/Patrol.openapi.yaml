        - Authentication
      security:
        - ApiKeyAuth: []
      x-patrol-roles:
        - operator
        - administrator
    delete:
      operationId: Sessions_signOut
      description: Delete the current session.
      parameters:
        - $ref: '#/components/parameters/Http.CsrfToken'
      responses:
        '204':
          description: A successful write that returns no body.
        '400':
          description: The request body is malformed or fails schema validation.
          content:
