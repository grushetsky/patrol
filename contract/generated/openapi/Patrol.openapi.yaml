      security:
        - ApiKeyAuth: []
      x-patrol-roles:
        - operator
        - administrator
  /auth/second-factor:
    post:
      operationId: Authentication_secondFactor
      description: Present the second factor for a pending challenge and receive the session cookie.
      parameters:
        - $ref: '#/components/parameters/Http.CsrfToken'
      responses:
        '200':
          description: Sign-in succeeded and the session cookie is set.
          headers:
            Set-Cookie:
              required: true
