        operatorId:
          $ref: '#/components/schemas/Domain.OperatorId'
          description: The operator who filed the notice.
        decidedAt:
          type: string
          format: date-time
          description: When the refusal was recorded.
        failure:
          $ref: '#/components/schemas/Domain.SubmissionFailure'
          description: The refusal and its cause.
      description: A submission the recipient refused. A rejected submission is not retried unchanged.
    Domain.RemovedViolation:
      type: object
      required:
        - state
        - closedAt
        - reason
      properties:
        state:
          type: string
          enum:
            - removed
          description: The literal state discriminator.
        closedAt:
          type: string
          format: date-time
          description: When removal was recorded.
        reason:
          $ref: '#/components/schemas/Domain.ViolationClosureReason'
          description: Why the violation closed.
        closureEvidenceId:
          $ref: '#/components/schemas/Domain.EvidenceId'
          description: The capture that showed the URL gone, when one exists.
        closedBy:
          $ref: '#/components/schemas/Domain.OperatorId'
          description: The operator who recorded the removal, when a person did.
      description: A violation whose URL stopped serving the copy.
    Domain.ReputationSnapshot:
      type: object
      required:
        - registrableDomain
        - confirmedViolations
        - bonus
        - blocklisted
      properties:
        registrableDomain:
          $ref: '#/components/schemas/Domain.RegistrableDomain'
          description: The registrable domain the reputation belongs to.
        confirmedViolations:
          type: integer
          format: int32
          minimum: 0
          description: Confirmed violations at the domain in the last twelve months.
        bonus:
          type: number
          format: float
          description: The bonus the count earned, before the cap.
        blocklisted:
          type: boolean
          description: Whether a blocklist entry added its small contribution.
      description: A host's reputation, aggregated at the registrable domain.
    Domain.ReservationState:
      type: string
      enum:
        - held
        - committed
        - released
        - expired
      description: The lifecycle of a budget reservation.
    Domain.ResolvedField:
      type: object
      required:
        - name
        - value
        - required
      properties:
        name:
          type: string
          description: The form field's name.
        value:
          type: string
          description: The value the operator copies.
        required:
          type: boolean
          description: Whether the form marks the field required.
        maxLength:
          type: integer
          format: int32
          minimum: 1
          description: The field's length cap, when the form publishes one.
      description: One resolved field of the recipient's form.
    Domain.ResourceKind:
      type: string
      enum:
        - media
        - websocket
        - service_worker
        - advertising
        - third_party_analytics
      description: Kinds of requests a capture blocks.
    Domain.ReviewDecision:
      type: object
      required:
        - id
        - candidateId
        - action
