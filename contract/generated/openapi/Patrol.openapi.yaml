        name:
          type: string
          description: The group's display name.
        locales:
          type: array
          items:
            $ref: '#/components/schemas/Domain.Locale'
          description: The locales the group's scans generate queries for. At least one is required.
        scanTime:
          type: string
          format: time
          description: The local time inside the scheduling window at which the group becomes due.
        priority:
          $ref: '#/components/schemas/Domain.GroupPriority'
          description: The group's scheduling priority.
      description: A change to a title group. Omitted fields keep their value.
    Http.UpdateTrackedTitleRequest:
      type: object
      properties:
        titleGroupId:
          $ref: '#/components/schemas/Domain.TitleGroupId'
          description: The group the title belongs to.
        releaseYear:
          type: integer
          format: int32
          minimum: 1878
          description: The four-digit year of first release.
        titleType:
          $ref: '#/components/schemas/Domain.TitleType'
          description: The kind of work.
        runtimeMinutes:
          type: integer
          format: int32
          minimum: 1
          description: The runtime in minutes. Absent when unknown.
        paused:
          type: boolean
          description: Whether scanning is paused for this title.
      description: A correction to a tracked title. Omitted fields keep their value.
    Http.VersionReport:
      type: object
      required:
        - buildVersion
        - migrationVersion
        - schemaCompatible
      properties:
        buildVersion:
          type: string
          description: The image's build version.
        migrationVersion:
          type: string
          description: The highest forward-only migration the image carries.
        schemaCompatible:
          type: boolean
          description: Whether the database's applied migration matches the image's expected version.
      description: The running build and the database schema it expects.
    Http.ViolationClosureRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          $ref: '#/components/schemas/Domain.ViolationClosureReason'
          description: Why the violation left the open state.
        note:
          type: string
          description: The operator's note. Required when the reason is operator_closed.
        evidenceId:
          $ref: '#/components/schemas/Domain.EvidenceId'
          description: The capture that showed the URL gone, when one exists.
      description: Close an open violation after a re-check, or record that its URL stopped serving the copy.
    Http.ViolationDetail:
      type: object
      required:
        - violation
        - displayTitle
        - releaseYear
        - titleType
        - evidence
        - decision
      properties:
        violation:
          $ref: '#/components/schemas/Domain.Violation'
          description: The violation record.
        displayTitle:
          type: string
          description: The tracked title's display title.
        releaseYear:
          type: integer
          format: int32
          description: The tracked title's release year.
        titleType:
          $ref: '#/components/schemas/Domain.TitleType'
          description: The tracked title's kind of work.
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Http.CitedEvidence'
          description: The captures the violation cites, newest first.
        decision:
          $ref: '#/components/schemas/Domain.ReviewDecision'
          description: The decision that confirmed the violation.
        notice:
          $ref: '#/components/schemas/Http.NoticeRef'
          description: The notice citing the violation, when one is active.
        newestCaptureOutcome:
          $ref: '#/components/schemas/Domain.CaptureOutcome'
          description: The newest capture's outcome, which flags a dead or blocked page at handoff.
      description: A violation with its evidence citations, decision, and notice attachment.
    Http.ViolationPage:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Http.ViolationRow'
          description: The violations on this page.
        total:
          type: integer
          format: int32
          description: How many violations match the filter in total.
        page:
          type: integer
          format: int32
          description: The one-based page number.
        pageSize:
          type: integer
          format: int32
          description: The page size.
      description: A page of violations, newest first.
    Http.ViolationRow:
      type: object
      required:
        - violation
        - displayTitle
        - releaseYear
        - titleType
      properties:
        violation:
          $ref: '#/components/schemas/Domain.Violation'
          description: The violation record.
        displayTitle:
          type: string
          description: The tracked title's display title, the heading the row groups under.
        releaseYear:
          type: integer
          format: int32
          description: The tracked title's release year.
        titleType:
          $ref: '#/components/schemas/Domain.TitleType'
          description: The tracked title's kind of work.
        newestEvidence:
          $ref: '#/components/schemas/Http.EvidenceSummary'
          description: The newest capture of the URL, when one exists.
        notice:
          $ref: '#/components/schemas/Http.NoticeRef'
          description: The notice the violation is cited by, when it is reserved by one.
      description: One violation as the violations screen renders it.
    Http.WikidataEntityFacts:
      type: object
      required:
        - qid
        - label
        - identifiers
      properties:
        qid:
          type: string
          description: The entity's QID.
        label:
          type: string
          description: The entity's label.
        description:
          type: string
          description: The entity's description, when one is published.
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/Http.WikidataIdentifierSuggestion'
          description: IMDb and KinoPoisk identifier suggestions. Nothing is stored until the operator saves.
      description: The facts a second read of a selected Wikidata entity offers.
    Http.WikidataIdentifierSuggestion:
      type: object
      required:
        - scheme
        - value
        - property
      properties:
        scheme:
          $ref: '#/components/schemas/Domain.ExternalIdentifierScheme'
          description: The scheme the value belongs to.
        value:
          type: string
          description: The identifier value.
        property:
          type: string
          description: The Wikidata property the value was read from.
      description: An external identifier read from a Wikidata claim.
    Http.WikidataSearchResult:
      type: object
      required:
        - query
        - suggestions
      properties:
        query:
          type: string
          description: The query as issued.
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/Http.WikidataSuggestion'
          description: At most ten entity suggestions.
      description: Wikidata's answer to the add-title field. A failure here never blocks local suggestions or free-text creation.
    Http.WikidataSuggestion:
      type: object
      required:
        - qid
        - label
      properties:
        qid:
          type: string
          description: The entity's QID.
        label:
          type: string
          description: The entity's label in the search language.
        description:
          type: string
          description: The entity's description, when one is published.
        matchedAlias:
          type: string
          description: The alias the query matched, when the match was an alias rather than the label.
        matchedAliasLanguage:
          $ref: '#/components/schemas/Domain.Locale'
          description: The language of the matched alias.
      description: One Wikidata entity suggestion for the add-title field.
    Http.YandexAcknowledgement:
      type: object
      required:
        - recipient
        - messageId
        - replyDate
      properties:
        recipient:
          type: string
          enum:
            - yandex
          description: The recipient this acknowledgement belongs to.
        messageId:
          type: string
          description: The Message-ID header of Yandex's reply.
        replyDate:
          type: string
          format: date
          description: The date of Yandex's reply.
      description: "Yandex's acknowledgement: the reply email's Message-ID and date."
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: cookie
      name: __Host-patrol_session
