    Domain.PendingSubmission:
      type: object
      required:
        - state
      properties:
        state:
          type: string
          enum:
            - pending
          description: The literal state discriminator.
      description: A submission awaiting the operator's filing.
    Domain.PostalAddress:
      type: object
      required:
        - line1
        - city
        - postalCode
        - country
      properties:
        line1:
          type: string
          description: The first address line.
        line2:
          type: string
          description: The second address line, when the address needs one.
        city:
          type: string
          description: The city or locality.
        region:
          type: string
          description: The state, province, or region, where the country uses one.
        postalCode:
          type: string
          description: The postal code.
        country:
          $ref: '#/components/schemas/Domain.CountryCode'
          description: The country of the address.
      description: A contact or legal postal address.
    Domain.QueryFailure:
      type: object
      required:
        - queryId
        - reason
        - attempts
      properties:
        queryId:
          $ref: '#/components/schemas/Domain.SearchQueryId'
