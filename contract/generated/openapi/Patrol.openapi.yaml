openapi: 3.1.0
info:
  title: Patrol
  version: 0.1.0
tags:
  - name: System
  - name: Authentication
  - name: Operators
  - name: Catalogue
  - name: Scans
  - name: Review
  - name: Violations
  - name: Evidence
  - name: Notices
  - name: Dashboard
  - name: Settings
paths:
  /auth/csrf:
    get:
      operationId: Authentication_csrf
      description: Issue a CSRF token and its cookie, for the sign-in and setup forms.
      parameters: []
      responses:
        '200':
          description: A freshly issued CSRF token and the cookie that pairs with it.
          headers:
            Set-Cookie:
              required: true
              description: The CSRF cookie the browser stores.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.CsrfTokenPayload'
      tags:
        - Authentication
      x-patrol-roles:
        - anonymous
  /auth/email:
    post:
      operationId: Sessions_changeEmail
      description: Change the email address. Every other session is revoked.
      parameters:
        - $ref: '#/components/parameters/Http.CsrfToken'
      responses:
        '204':
          description: A successful write that returns no body.
        '400':
          description: The request body is malformed or fails schema validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.ErrorBody'
        '401':
          description: No valid session, or the credentials offered are wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.ErrorBody'
        '403':
          description: The session is valid but the operator's role does not grant the operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.ErrorBody'
        '409':
          description: The request conflicts with the record's current state or with an existing record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.ConflictBody'
        '422':
          description: The request is well formed but breaks a domain rule, such as a recipient's URL cap or an exhausted quota.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.ErrorBody'
        '429':
          description: Too many attempts, such as a locked account or a throttled address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.ErrorBody'
        '503':
          description: The deployment is not bootstrapped, or its schema version does not match the running image.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.ErrorBody'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Http.EmailChangeRequest'
      security:
        - ApiKeyAuth: []
      x-patrol-roles:
        - operator
        - administrator
  /auth/enrollment:
    post:
      operationId: Authentication_beginEnrollment
      description: Start the TOTP enrolment a setup or invitation ceremony requires.
      parameters:
        - $ref: '#/components/parameters/Http.CsrfToken'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.TotpEnrollment'
        '400':
          description: The request body is malformed or fails schema validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.ErrorBody'
        '401':
          description: No valid session, or the credentials offered are wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.ErrorBody'
        '422':
          description: The request is well formed but breaks a domain rule, such as a recipient's URL cap or an exhausted quota.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.ErrorBody'
        '503':
          description: The deployment is not bootstrapped, or its schema version does not match the running image.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.ErrorBody'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Http.TotpEnrollmentRequest'
      x-patrol-roles:
        - anonymous
  /auth/enrollment/confirmation:
    post:
      operationId: Authentication_confirmEnrollment
      description: Confirm the enrolment code, receive the recovery codes, and sign in.
      parameters:
        - $ref: '#/components/parameters/Http.CsrfToken'
      responses:
        '201':
          description: Registration completed and the session cookie is set.
          headers:
            Set-Cookie:
              required: true
              description: The session cookie. The API sets it and the browser stores it.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.RegistrationCompleted'
        '400':
          description: The request body is malformed or fails schema validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.ErrorBody'
        '401':
          description: No valid session, or the credentials offered are wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.ErrorBody'
        '422':
          description: The request is well formed but breaks a domain rule, such as a recipient's URL cap or an exhausted quota.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.ErrorBody'
        '503':
          description: The deployment is not bootstrapped, or its schema version does not match the running image.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.ErrorBody'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Http.TotpEnrollmentConfirmation'
      x-patrol-roles:
        - anonymous
  /auth/password:
    post:
      operationId: Sessions_changePassword
      description: Change the password. Every other session is revoked.
      parameters:
        - $ref: '#/components/parameters/Http.CsrfToken'
      responses:
        '204':
          description: A successful write that returns no body.
        '400':
          description: The request body is malformed or fails schema validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.ErrorBody'
        '401':
          description: No valid session, or the credentials offered are wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.ErrorBody'
        '403':
          description: The session is valid but the operator's role does not grant the operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.ErrorBody'
        '409':
          description: The request conflicts with the record's current state or with an existing record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.ConflictBody'
        '422':
          description: The request is well formed but breaks a domain rule, such as a recipient's URL cap or an exhausted quota.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.ErrorBody'
        '429':
