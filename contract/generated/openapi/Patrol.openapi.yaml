  /auth/totp/confirmation:
    post:
      operationId: Sessions_confirmReenrollment
      description: Confirm the new second factor and receive fresh recovery codes. Other sessions are revoked.
      parameters:
        - $ref: '#/components/parameters/Http.CsrfToken'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.RecoveryCodesIssued'
        '400':
          description: The request body is malformed or fails schema validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.ErrorBody'
        '401':
