  /auth/setup:
    post:
      operationId: Authentication_setup
      description: Consume the bootstrap token, set the first administrator's password, and start the enrolment ceremony.
      parameters:
        - $ref: '#/components/parameters/Http.CsrfToken'
      responses:
        '201':
          description: The account was created in the invited state and must enrol a second factor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.EnrollmentCeremony'
