        reason:
          type: string
          description: The provider's error class or the adapter's reason.
        attempts:
          type: integer
          format: int32
          minimum: 0
          description: How many attempts the query consumed.
      description: One failed query inside a scan.
    Domain.QueryKind:
      type: string
      enum:
        - variant
        - intent
      description: How a query was generated from a title.
    Domain.QueryPlan:
      type: object
      required:
        - generatedAt
        - queries
      properties:
        generatedAt:
          type: string
          format: date-time
          description: When the plan was derived.
        queries:
          type: array
          items:
            $ref: '#/components/schemas/Domain.SearchQuery'
          description: The queries in plan order. The plan never outlives its scan.
      description: The set of search queries one scan issues for one title group on one engine, derived when the scan starts.
    Domain.QueuedScan:
      type: object
      required:
        - state
        - queuedAt
      properties:
        state:
          type: string
