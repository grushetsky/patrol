        - decidedAt
        - evidenceIds
      properties:
        id:
          $ref: '#/components/schemas/Domain.ReviewDecisionId'
          description: Patrol's own identifier.
        candidateId:
          $ref: '#/components/schemas/Domain.CandidateId'
          description: The candidate decided on.
        action:
          $ref: '#/components/schemas/Domain.ReviewDecisionAction'
          description: The disposition.
        operatorId:
          $ref: '#/components/schemas/Domain.OperatorId'
          description: The operator who decided.
        decidedAt:
          type: string
          format: date-time
          description: When the operator decided.
        note:
          type: string
          description: The operator's note.
        evidenceIds:
          type: array
          items:
            $ref: '#/components/schemas/Domain.EvidenceId'
          description: The evidence the operator relied on, pinned at decision time.
        violationId:
          $ref: '#/components/schemas/Domain.ViolationId'
          description: The violation created, when the action confirms one.
        rematchedTrackedTitleId:
          $ref: '#/components/schemas/Domain.TrackedTitleId'
          description: The correct tracked title, when the action is wrong work.
        proposedAllowlistEntryId:
          $ref: '#/components/schemas/Domain.AllowlistEntryId'
          description: The allowlist entry proposed, when the action is authorized here.
      description: An operator's disposition of a candidate.
    Domain.ReviewDecisionAction:
      type: string
      enum:
        - violation
        - not_a_violation
        - wrong_work
        - authorized_here
        - page_dead
      description: An operator's disposition of a candidate.
    Domain.ReviewDecisionId:
      type: string
      format: uuid
      description: Identifier of a review decision.
    Domain.RightsHolder:
