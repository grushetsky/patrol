      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Http.ReenrollmentConfirmation'
      security:
        - ApiKeyAuth: []
      x-patrol-roles:
        - operator
        - administrator
  /candidates:
    get:
      operationId: Candidates_list
      description: The review queue, filtered by state, engine, group, or band. An allowlist hit can be filtered separately.
      parameters:
        - $ref: '#/components/parameters/Http.PageRequest.page'
        - $ref: '#/components/parameters/Http.PageRequest.pageSize'
        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Domain.CandidateState'
          explode: false
        - name: titleGroupId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Domain.TitleGroupId'
          explode: false
        - name: engine
          in: query
          required: false
          schema:
