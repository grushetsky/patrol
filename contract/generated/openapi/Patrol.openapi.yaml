          type: string
          format: date-time
          description: When the scan was queued.
        queuedReason:
          $ref: '#/components/schemas/Domain.ScanFailureReason'
          description: Why the scan is still queued, when it is waiting rather than next in line.
      description: A scan waiting to start.
    Domain.QuotaLedger:
      type: object
      required:
        - id
        - engine
        - monthStart
        - allowanceUnits
        - scanReserved
        - scanCommitted
        - recheckReserved
        - recheckCommitted
      properties:
        id:
          $ref: '#/components/schemas/Domain.QuotaLedgerId'
          description: Patrol's own identifier.
        engine:
          $ref: '#/components/schemas/Domain.Engine'
          description: The engine the row belongs to.
        monthStart:
          type: string
          format: date
          description: The first day of the UTC month the row covers.
        allowanceUnits:
          type: integer
          format: int32
          minimum: 0
          description: The month's billable units for the engine.
        scanReserved:
          type: integer
          format: int32
          minimum: 0
          description: Units reserved by scans and not yet settled.
        scanCommitted:
          type: integer
          format: int32
          minimum: 0
          description: Units committed by scans.
        recheckReserved:
          type: integer
          format: int32
          minimum: 0
          description: Units reserved by re-checks and not yet settled.
        recheckCommitted:
          type: integer
          format: int32
          minimum: 0
          description: Units committed by re-checks.
      description: One engine's allowance for one UTC calendar month.
    Domain.QuotaLedgerId:
      type: string
      format: uuid
      description: Identifier of a quota ledger row, one per engine and UTC month.
    Domain.RecheckSchedule:
      type: object
      required:
        - id
        - titleGroupId
        - engine
        - rung
        - nextDueAt
        - active
        - startedByScanId
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Domain.RecheckScheduleId'
          description: Patrol's own identifier.
        titleGroupId:
          $ref: '#/components/schemas/Domain.TitleGroupId'
          description: The title group the ladder belongs to.
        engine:
          $ref: '#/components/schemas/Domain.Engine'
          description: The engine the ladder re-checks on.
        rung:
          type: integer
          format: int32
          minimum: 1
          description: "The ladder's rung: one for three days, two for seven, three for fourteen, then every fourteen days."
        nextDueAt:
          type: string
          format: date-time
          description: When the next re-check falls due.
        active:
          type: boolean
          description: Whether the ladder is running. It stops when no violation from the pair is open.
        startedByScanId:
          $ref: '#/components/schemas/Domain.ScanId'
          description: The scan that started or last reset the ladder.
        updatedAt:
          type: string
          format: date-time
          description: When the ladder was last updated.
      description: The re-check ladder for one title group and engine.
    Domain.RecheckScheduleId:
      type: string
      format: uuid
      description: Identifier of a re-check ladder, one per title group and engine.
    Domain.Recipient:
      type: string
      enum:
        - google
        - bing
        - yandex
      description: An organisation to which Patrol submits notices.
    Domain.RecipientChannel:
      type: string
      enum:
        - web_form
        - trusted_program
      description: How a notice is handed to a recipient.
    Domain.RecipientProfile:
      type: object
      required:
        - id
        - recipient
        - channel
        - account
        - compositionTrigger
        - eligibleTerritories
        - paused
        - recentSubmissions
        - version
        - updatedBy
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Domain.RecipientProfileId'
          description: Patrol's own identifier.
        recipient:
          $ref: '#/components/schemas/Domain.Recipient'
          description: The recipient the profile addresses.
        channel:
          $ref: '#/components/schemas/Domain.RecipientChannel'
          description: The channel the submission runs through.
        account:
          type: string
          description: The account the submission runs under, such as a Google account email.
        contactEmail:
          $ref: '#/components/schemas/Domain.Email'
          description: The contact mailbox the form asks for, where the account is not it.
        compositionTrigger:
          $ref: '#/components/schemas/Domain.CompositionTrigger'
          description: When drafts are composed for this profile.
        windowTime:
          type: string
          format: time
          description: The UTC time the scheduled composition window opens.
        eligibleTerritories:
          type: array
          items:
            $ref: '#/components/schemas/Domain.Territory'
          description: The territories in which the rights holder is eligible to submit. Empty means every territory.
        maxUrlsPerNotice:
          type: integer
          format: int32
          minimum: 1
          description: The recipient's published per-notice URL cap, where one is published.
        maxUrlsPerFile:
          type: integer
          format: int32
          minimum: 1
          description: The recipient's published per-file URL cap, where one is published.
        maxUrlsPerDay:
          type: integer
          format: int32
          minimum: 1
          description: The recipient's published per-day URL cap, where one is published.
        lastObservedMaxUrlsPerFile:
          type: integer
          format: int32
          minimum: 1
          description: The per-file cap last observed from the recipient's error text.
        lastObservedDailyQuota:
          type: integer
          format: int32
          minimum: 1
          description: The per-day quota last observed from the recipient.
        paused:
          type: boolean
          description: Whether scheduled drafting is paused by the rejection threshold.
        pauseReason:
          type: string
          description: Why the profile is paused, when it is.
        recentSubmissions:
          $ref: '#/components/schemas/Domain.SubmissionStats'
          description: The profile's recent submission outcome, the input to the pause threshold.
        version:
          type: integer
          format: int32
          minimum: 1
          description: The profile's version, snapshotted into a notice at approval.
        updatedBy:
          $ref: '#/components/schemas/Domain.OperatorId'
          description: The administrator who last edited the profile.
        updatedAt:
          type: string
          format: date-time
          description: When the profile was last edited.
      description: "The configuration for one recipient's submission channel: its channel, account, required fields, limits, eligibility, and composition trigger."
    Domain.RecipientProfileId:
      type: string
      format: uuid
      description: Identifier of a recipient profile.
    Domain.RecipientProfileSnapshot:
      type: object
      required:
        - profileId
        - version
        - channel
        - account
        - capturedAt
      properties:
        profileId:
          $ref: '#/components/schemas/Domain.RecipientProfileId'
          description: The profile's identifier.
        version:
          type: integer
          format: int32
          description: The profile's version.
        channel:
          $ref: '#/components/schemas/Domain.RecipientChannel'
          description: The channel used.
        account:
          type: string
          description: The account used.
        formUrl:
          $ref: '#/components/schemas/Domain.Url'
          description: The form URL observed at approval.
        maxUrlsPerNotice:
          type: integer
          format: int32
          description: The per-notice URL cap observed at approval.
        maxUrlsPerFile:
          type: integer
          format: int32
          description: The per-file URL cap observed at approval.
        capturedAt:
          type: string
          format: date-time
          description: When the snapshot was taken.
      description: The recipient profile a notice was composed under, frozen at approval.
    Domain.RedirectHop:
      type: object
      required:
        - url
        - statusCode
      properties:
        url:
          $ref: '#/components/schemas/Domain.Url'
          description: The URL of this hop.
        statusCode:
          type: integer
          format: int32
          description: The status code this hop returned.
        location:
          type: string
          description: The Location header this hop returned, when it redirected.
      description: One HTTP hop in a redirect chain.
    Domain.RegistrableDomain:
      type: string
      description: The eTLD+1 grouping of a host, used for reputation and reporting.
    Domain.RejectedSubmission:
      type: object
      required:
        - state
        - operatorId
        - decidedAt
