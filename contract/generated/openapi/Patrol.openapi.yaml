          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.ConflictBody'
        '422':
          description: The request is well formed but breaks a domain rule, such as a recipient's URL cap or an exhausted quota.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.ErrorBody'
        '429':
          description: Too many attempts, such as a locked account or a throttled address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.ErrorBody'
        '503':
          description: The deployment is not bootstrapped, or its schema version does not match the running image.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.ErrorBody'
      tags:
        - Authentication
      security:
        - ApiKeyAuth: []
      x-patrol-roles:
        - operator
        - administrator
  /auth/sessions:
    get:
      operationId: Sessions_listSessions
      description: The operator's own sessions, newest first.
      parameters:
        - $ref: '#/components/parameters/Http.PageRequest.page'
        - $ref: '#/components/parameters/Http.PageRequest.pageSize'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
