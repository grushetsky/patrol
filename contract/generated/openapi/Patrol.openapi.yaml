  /auth/session:
    get:
      operationId: Sessions_read
      description: The operator and session behind the cookie, plus the CSRF token mutations carry.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.AuthenticatedSession'
        '401':
          description: No valid session, or the credentials offered are wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.ErrorBody'
        '403':
