components:
  parameters:
    Http.CsrfToken:
      name: X-Patrol-CSRF
      in: header
      required: true
      description: The token from the session payload, echoed in the header and compared with the cookie server side.
      schema:
        type: string
    Http.PageRequest.page:
      name: page
      in: query
      required: false
      description: The one-based page number. Defaults to one.
      schema:
        type: integer
        format: int32
      explode: false
    Http.PageRequest.pageSize:
      name: pageSize
      in: query
      required: false
      description: Items per page, at most two hundred. Defaults to fifty.
      schema:
        type: integer
        format: int32
      explode: false
  schemas:
    Domain.AcknowledgedSubmission:
      type: object
      required:
        - state
        - operatorId
        - deliveredAt
        - attestation
        - acknowledgement
      properties:
        state:
          type: string
          enum:
            - acknowledged
          description: The literal state discriminator.
        operatorId:
          $ref: '#/components/schemas/Domain.OperatorId'
          description: The operator who filed the notice.
        deliveredAt:
          type: string
          format: date-time
          description: When the operator filed the notice.
        attestation:
          $ref: '#/components/schemas/Domain.OperatorAttestation'
          description: The operator's attestation that the notice was filed as presented.
        acknowledgement:
          $ref: '#/components/schemas/Domain.Acknowledgement'
          description: What the recipient returned.
      description: A submission the recipient acknowledged.
    Domain.Acknowledgement:
      type: object
      required:
        - recipient
      properties:
        recipient:
          $ref: '#/components/schemas/Domain.Recipient'
          description: The recipient that acknowledged.
        referenceNumber:
          type: string
          description: Google's reference number.
        dashboardUrl:
          $ref: '#/components/schemas/Domain.Url'
          description: Google's Removals Dashboard URL.
        ticketId:
          type: string
          description: Bing's TicketId.
        ticketDetailsUrl:
          $ref: '#/components/schemas/Domain.Url'
          description: Bing's ticket-details URL.
        messageId:
          type: string
          description: Yandex's reply email Message-ID.
        replyDate:
          type: string
          format: date
          description: The date of Yandex's reply.
        note:
          type: string
          description: The operator's note, where the recipient published no identifier.
      description: What a recipient returned when it accepted a notice.
    Domain.AcquisitionBudget:
      type: object
      required:
        - engineCaps
        - recheckSharePercent
      properties:
        engineCaps:
          type: array
          items:
            $ref: '#/components/schemas/Domain.EngineBudgetCap'
          description: The cap for each engine. Bing is deferred and carries a zero cap until it is added.
        recheckSharePercent:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: The percentage of each engine allowance reserved for re-checks, defaulting to 30.
      description: The monthly acquisition cap and the share reserved for re-checks.
    Domain.AllowlistEntry:
      type: object
      required:
        - id
        - kind
        - matchKind
        - value
        - scope
        - origin
        - confirmedBy
        - confirmedAt
      properties:
        id:
          $ref: '#/components/schemas/Domain.AllowlistEntryId'
          description: Patrol's own identifier.
        kind:
          $ref: '#/components/schemas/Domain.AllowlistKind'
          description: Why the host or URL prefix is allowed.
        matchKind:
          $ref: '#/components/schemas/Domain.AllowlistMatchKind'
          description: How the value matches a URL.
        value:
          type: string
          description: The host or URL prefix the entry matches.
        scope:
          $ref: '#/components/schemas/Domain.AllowlistScope'
          description: What the entry covers.
        titleGroupId:
          $ref: '#/components/schemas/Domain.TitleGroupId'
          description: The title group the entry is scoped to, required when the scope is a title group.
        trackedTitleId:
          $ref: '#/components/schemas/Domain.TrackedTitleId'
          description: The tracked title the entry is scoped to, required when the scope is a tracked title.
        territory:
          $ref: '#/components/schemas/Domain.Territory'
          description: The territory the entry applies to. Required for a licensed destination, where it is a territory or intended as worldwide; ignored for an official domain or a neutral source.
        origin:
          $ref: '#/components/schemas/Domain.AllowlistOrigin'
          description: How the entry came to exist. No entry is created silently.
        proposedByDecisionId:
          $ref: '#/components/schemas/Domain.ReviewDecisionId'
          description: The review decision that proposed the entry, present when the origin is a review decision.
        confirmedBy:
          $ref: '#/components/schemas/Domain.OperatorId'
          description: The operator who confirmed the entry.
        confirmedAt:
          type: string
          format: date-time
          description: When the operator confirmed the entry.
      description: A scoped rule that marks a host or URL prefix as authorized or non-infringing.
    Domain.AllowlistEntryId:
      type: string
      format: uuid
      description: Identifier of an allowlist entry.
    Domain.AllowlistKind:
      type: string
      enum:
        - official_domain
        - licensed_destination
        - neutral_source
      description: Why a host or URL prefix is allowed.
    Domain.AllowlistMatchKind:
      type: string
      enum:
        - host
        - url_prefix
      description: How an allowlist value matches a URL.
    Domain.AllowlistOrigin:
      type: string
      enum:
        - operator
        - review_decision
      description: How an allowlist entry came to exist.
    Domain.AllowlistScope:
      type: string
      enum:
        - rights_holder
        - title_group
        - tracked_title
      description: What an allowlist entry covers.
    Domain.ApprovedNotice:
      type: object
      required:
        - state
        - approvedBy
        - approvedAt
        - rightsHolder
        - signatory
        - profile
      properties:
        state:
          type: string
          enum:
            - approved
          description: The literal state discriminator.
        approvedBy:
          $ref: '#/components/schemas/Domain.OperatorId'
          description: The operator who approved the notice.
        approvedAt:
          type: string
          format: date-time
          description: When the notice was approved.
        rightsHolder:
          $ref: '#/components/schemas/Domain.RightsHolderSnapshot'
          description: The rights-holder contact profile, frozen at approval.
        signatory:
          $ref: '#/components/schemas/Domain.SignatorySnapshot'
          description: The signatory, frozen at approval.
        profile:
          $ref: '#/components/schemas/Domain.RecipientProfileSnapshot'
          description: The recipient profile, frozen at approval.
      description: An approved notice. Content is frozen and the parties are snapshotted.
    Domain.BudgetBucket:
      type: string
      enum:
        - scan
        - recheck
      description: Which share of an engine allowance a reservation draws on.
    Domain.BudgetReservation:
      type: object
      required:
        - id
        - scanId
        - engine
        - bucket
        - units
        - state
        - createdAt
        - expiresAt
      properties:
        id:
          $ref: '#/components/schemas/Domain.BudgetReservationId'
          description: Patrol's own identifier.
        scanId:
          $ref: '#/components/schemas/Domain.ScanId'
          description: The scan holding the reservation.
        engine:
          $ref: '#/components/schemas/Domain.Engine'
          description: The engine whose allowance is reserved.
        bucket:
          $ref: '#/components/schemas/Domain.BudgetBucket'
          description: The bucket the reservation draws on.
        units:
          type: integer
          format: int32
          minimum: 0
          description: The number of billable units reserved.
        state:
          $ref: '#/components/schemas/Domain.ReservationState'
          description: The reservation's state.
        createdAt:
          type: string
          format: date-time
          description: When the reservation was made.
        expiresAt:
          type: string
          format: date-time
          description: When an unstarted reservation expires; one hour after it was made.
        settledAt:
          type: string
          format: date-time
          description: When the reservation was committed, released, or expired.
        committedUnits:
          type: integer
          format: int32
          minimum: 0
          description: The units the scan actually issued at settlement; a partial scan commits these and releases the rest.
        releasedUnits:
          type: integer
          format: int32
          minimum: 0
          description: The units released at settlement, including every unit of a failed or expired reservation.
      description: A scan's hold on a slice of an engine allowance. Held before the scan runs, then committed or released.
    Domain.BudgetReservationId:
      type: string
      format: uuid
      description: Identifier of a budget reservation held by a scan.
    Domain.Candidate:
      type: object
      required:
        - id
        - trackedTitleId
        - url
        - normalizedUrl
        - host
        - registrableDomain
        - matchedVariantId
        - matchedVariant
        - score
        - scoreComponents
        - reputation
        - firstObservedAt
        - lastObservedAt
        - priorDecisionIds
        - lifecycle
      properties:
        id:
          $ref: '#/components/schemas/Domain.CandidateId'
          description: Patrol's own identifier.
        trackedTitleId:
          $ref: '#/components/schemas/Domain.TrackedTitleId'
          description: The tracked title the URL is paired with.
        url:
          $ref: '#/components/schemas/Domain.Url'
          description: The raw URL of the first observation.
        normalizedUrl:
          $ref: '#/components/schemas/Domain.NormalizedUrl'
          description: The URL's deduplication key. A candidate deduplicates across queries and engines on this key and the tracked title.
        host:
          $ref: '#/components/schemas/Domain.Host'
          description: The landing page's host after redirects.
        registrableDomain:
          $ref: '#/components/schemas/Domain.RegistrableDomain'
          description: The landing page's registrable domain.
        matchedVariantId:
          $ref: '#/components/schemas/Domain.TitleVariantId'
          description: The variant whose query surfaced the candidate.
        matchedVariant:
          $ref: '#/components/schemas/Domain.VariantSnapshot'
          description: The matched variant as it was at observation time.
        score:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: The candidate's score out of one.
        scoreComponents:
          $ref: '#/components/schemas/Domain.ScoreComponents'
          description: Every score component, recorded so a decision can be reproduced.
        reputation:
          $ref: '#/components/schemas/Domain.ReputationSnapshot'
          description: The host's reputation at scoring time.
        allowlistEntryId:
          $ref: '#/components/schemas/Domain.AllowlistEntryId'
          description: The allowlist entry that hit this URL, when one did. An allowlisted URL is never captured.
        firstObservedAt:
          type: string
          format: date-time
          description: When the pair was first observed.
        lastObservedAt:
          type: string
          format: date-time
          description: When the pair was last observed.
        priorDecisionIds:
          type: array
          items:
            $ref: '#/components/schemas/Domain.ReviewDecisionId'
          description: Prior review decisions on this pair, newest first.
        lifecycle:
          $ref: '#/components/schemas/Domain.CandidateLifecycle'
          description: The candidate's lifecycle state.
      description: A URL paired with one tracked title, surfaced by at least one search result and not yet confirmed as a violation.
    Domain.CandidateId:
      type: string
      format: uuid
      description: Identifier of a candidate, the URL and tracked-title pair.
    Domain.CandidateLifecycle:
      anyOf:
        - $ref: '#/components/schemas/Domain.PendingCandidate'
        - $ref: '#/components/schemas/Domain.ConfirmedCandidate'
        - $ref: '#/components/schemas/Domain.DismissedCandidate'
      description: The candidate state machine.
    Domain.CandidateState:
      type: string
      enum:
        - pending
        - confirmed
        - dismissed
      description: The candidate lifecycle states.
    Domain.CaptureOutcome:
      type: string
      enum:
        - captured
        - dead
        - blocked
        - error
      description: What a capture observed.
    Domain.CaptureProfile:
      type: object
      required:
        - userAgent
        - viewportWidth
        - viewportHeight
        - locale
        - timezone
        - javascriptEnabled
        - blockedResourceKinds
        - navigationPolicy
        - extractorVersion
      properties:
        userAgent:
          type: string
          description: The user agent Patrol identified itself with.
        viewportWidth:
          type: integer
          format: int32
          minimum: 1
          description: The viewport width in CSS pixels.
        viewportHeight:
          type: integer
          format: int32
          minimum: 1
          description: The viewport height in CSS pixels.
        locale:
          $ref: '#/components/schemas/Domain.Locale'
          description: The locale the browser was configured with.
        timezone:
          $ref: '#/components/schemas/Domain.TimeZoneId'
          description: The browser's time zone.
        javascriptEnabled:
          type: boolean
          description: Whether JavaScript ran before the DOM and screenshot were taken.
        blockedResourceKinds:
          type: array
          items:
            $ref: '#/components/schemas/Domain.ResourceKind'
          description: Request kinds the capture blocked.
        navigationPolicy:
          type: string
          description: The navigation and readiness policy, such as a load plus settle rather than network idle.
        extractorVersion:
          type: string
          description: The extractor version that produced the extraction sidecar.
      description: The browser and extraction settings of one capture, without which the capture cannot be explained or repeated.
    Domain.CaptureReason:
      type: string
      enum:
        - detection
        - review
        - pre_handoff
      description: Why a capture was taken.
    Domain.CatalogueSource:
      type: string
      enum:
        - rights_holder_record
        - operator_knowledge
        - wikidata
      description: Where a catalogue value came from.
    Domain.CitedViolation:
      type: object
      required:
        - violationId
        - evidence
      properties:
        violationId:
          $ref: '#/components/schemas/Domain.ViolationId'
          description: The violation cited.
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Domain.EvidenceCitation'
          description: The evidence the notice cites for this violation. A later capture never changes it.
      description: One violation cited by a notice, with the captures the notice relies on.
    Domain.ClosedViolation:
      type: object
      required:
        - state
        - closedAt
        - reason
        - closedBy
      properties:
        state:
          type: string
          enum:
            - closed
          description: The literal state discriminator.
        closedAt:
          type: string
          format: date-time
          description: When the operator closed the violation.
        reason:
          $ref: '#/components/schemas/Domain.ViolationClosureReason'
          description: Why the violation closed.
        closedBy:
          $ref: '#/components/schemas/Domain.OperatorId'
          description: The operator who closed the violation.
        note:
          type: string
          description: The operator's note.
      description: A violation an operator closed after a re-check.
    Domain.CompositionTrigger:
      type: string
      enum:
        - scheduled
        - on_demand
      description: When a recipient profile composes notice drafts.
    Domain.ConfirmedCandidate:
      type: object
      required:
        - state
        - reviewDecisionId
        - violationId
        - confirmedAt
      properties:
        state:
          type: string
          enum:
            - confirmed
          description: The literal state discriminator.
        reviewDecisionId:
          $ref: '#/components/schemas/Domain.ReviewDecisionId'
          description: The decision that created the violation.
        violationId:
          $ref: '#/components/schemas/Domain.ViolationId'
          description: The violation the decision created.
        confirmedAt:
          type: string
          format: date-time
          description: When the violation was confirmed.
      description: A candidate confirmed as a violation.
    Domain.CountryCode:
      type: string
      pattern: ^[A-Z]{2}$
      description: An ISO 3166-1 alpha-2 country code, uppercase.
    Domain.Currency:
      type: string
      enum:
        - usd
      description: A currency Patrol's acquisition cap supports.
    Domain.DeliveredSubmission:
      type: object
      required:
        - state
        - operatorId
        - deliveredAt
        - attestation
      properties:
        state:
          type: string
          enum:
            - delivered
          description: The literal state discriminator.
        operatorId:
          $ref: '#/components/schemas/Domain.OperatorId'
          description: The operator who filed the notice.
        deliveredAt:
          type: string
          format: date-time
          description: When the operator filed the notice.
        attestation:
          $ref: '#/components/schemas/Domain.OperatorAttestation'
          description: The operator's attestation that the notice was filed as presented.
      description: A submission the operator filed and attested.
    Domain.Dismissal:
      type: object
      required:
        - action
        - operatorId
        - decidedAt
        - evidenceIds
      properties:
        action:
          $ref: '#/components/schemas/Domain.ReviewDecisionAction'
          description: The review decision that dismissed the pair.
        operatorId:
          $ref: '#/components/schemas/Domain.OperatorId'
          description: The operator who decided.
        decidedAt:
          type: string
          format: date-time
          description: When the operator decided.
        note:
          type: string
          description: The operator's note, when one was recorded.
        evidenceIds:
          type: array
          items:
            $ref: '#/components/schemas/Domain.EvidenceId'
          description: The evidence the operator relied on.
        rematchedTrackedTitleId:
          $ref: '#/components/schemas/Domain.TrackedTitleId'
          description: The correct tracked title, when the decision was wrong work.
        proposedAllowlistEntryId:
          $ref: '#/components/schemas/Domain.AllowlistEntryId'
          description: The allowlist entry the decision proposed, when the decision was authorized here.
      description: A dismissal, which suppresses one URL and tracked-title pair only.
    Domain.DismissedCandidate:
      type: object
      required:
        - state
        - reviewDecisionId
        - dismissal
      properties:
        state:
          type: string
          enum:
            - dismissed
          description: The literal state discriminator.
        reviewDecisionId:
          $ref: '#/components/schemas/Domain.ReviewDecisionId'
          description: The decision that dismissed the pair.
        dismissal:
          $ref: '#/components/schemas/Domain.Dismissal'
          description: The dismissal, including the scope it suppresses.
      description: A candidate dismissed by a review decision.
    Domain.DraftNotice:
      type: object
      required:
        - state
      properties:
        state:
          type: string
          enum:
            - draft
          description: The literal state discriminator.
        updatedAt:
          type: string
          format: date-time
          description: When the draft was last edited.
      description: A notice being composed. Its content may still change.
    Domain.Email:
      type: string
      format: email
      description: An email address.
    Domain.Engine:
      type: string
      enum:
        - google
        - bing
        - yandex
      description: A search source that returns results for a query.
    Domain.EngineBudgetCap:
      type: object
      required:
        - engine
        - currency
        - monthlyCapMinor
      properties:
        engine:
          $ref: '#/components/schemas/Domain.Engine'
          description: The engine the cap applies to.
        currency:
          $ref: '#/components/schemas/Domain.Currency'
          description: The currency of the cap.
        monthlyCapMinor:
          type: integer
          format: int32
          minimum: 0
          description: The monthly cap in the currency's minor unit, such as cents.
      description: One engine's monthly cap and the billable units it buys.
    Domain.Evidence:
      type: object
      required:
        - id
        - requestedUrl
        - normalizedRequestedUrl
        - redirectChain
        - reason
        - outcome
        - attemptNumber
        - observedAt
        - profile
        - artifacts
      properties:
        id:
          $ref: '#/components/schemas/Domain.EvidenceId'
          description: Patrol's own identifier.
        requestedUrl:
          $ref: '#/components/schemas/Domain.Url'
          description: The URL as it was requested, stored verbatim.
        normalizedRequestedUrl:
          $ref: '#/components/schemas/Domain.NormalizedUrl'
          description: The requested URL's deduplication key.
        redirectChain:
          type: array
          items:
            $ref: '#/components/schemas/Domain.RedirectHop'
          description: Every redirect hop, in order, with its status and Location.
        finalUrl:
          $ref: '#/components/schemas/Domain.Url'
          description: The landing page's final URL, absent when no response was received.
        host:
          $ref: '#/components/schemas/Domain.Host'
          description: The landing page's host, absent when no response was received.
        hostSource:
          $ref: '#/components/schemas/Domain.HostSource'
          description: Where the host was derived from, when a host was recorded.
        reason:
          $ref: '#/components/schemas/Domain.CaptureReason'
          description: Why the capture was taken.
        outcome:
          $ref: '#/components/schemas/Domain.CaptureOutcome'
          description: What the capture observed.
        httpStatus:
          type: integer
          format: int32
          description: The final response's HTTP status, when one was received.
        failureReason:
          type: string
          description: Why the capture did not succeed, when the outcome is not captured.
        attemptNumber:
          type: integer
          format: int32
          minimum: 1
          description: The attempt number within the retry window, starting at one.
        observedAt:
          type: string
          format: date-time
          description: When the page was observed, in UTC. The capture time is part of the record.
        profile:
          $ref: '#/components/schemas/Domain.CaptureProfile'
          description: The browser and extraction settings of the capture.
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/Domain.EvidenceArtifact'
          description: The artifacts the capture produced. An absence carries none, which is itself the record.
        purgedAt:
          type: string
          format: date-time
          description: When the bytes were purged, absent until retention acts.
        purgeReason:
          type: string
          description: Why the bytes were purged, present with the purge marker.
      description: An immutable, content-addressed record of what a URL served at one capture time. The record of one capture.
    Domain.EvidenceArtifact:
      type: object
      required:
        - kind
        - sha256
        - byteSize
        - contentType
        - truncated
      properties:
        kind:
          $ref: '#/components/schemas/Domain.EvidenceArtifactKind'
          description: Which artifact this is.
        sha256:
          $ref: '#/components/schemas/Domain.Sha256'
          description: The SHA-256 of the bytes, which is also the object key.
        byteSize:
          type: integer
          format: int32
          minimum: 0
          description: The artifact's size in bytes.
        contentType:
          type: string
          description: The artifact's content type.
        width:
          type: integer
          format: int32
          minimum: 0
          description: The artifact's width in pixels, for image artifacts.
        height:
          type: integer
          format: int32
          minimum: 0
          description: The artifact's height in pixels, for image artifacts.
        truncated:
          type: boolean
          description: Whether the artifact was truncated at a ceiling. Truncation is flagged, never silent.
      description: One artifact produced by a capture, keyed by the SHA-256 of its bytes.
    Domain.EvidenceArtifactKind:
      type: string
      enum:
        - response_body
        - response_headers
        - rendered_dom
        - screenshot
        - thumbnail
        - extraction_sidecar
      description: The kinds of artifact a capture can produce.
    Domain.EvidenceCitation:
      type: object
      required:
        - evidenceId
        - capturedAt
        - reason
      properties:
        evidenceId:
          $ref: '#/components/schemas/Domain.EvidenceId'
          description: The capture cited.
        capturedAt:
          type: string
          format: date-time
          description: When the capture was taken, frozen with the citation.
        reason:
          $ref: '#/components/schemas/Domain.CaptureReason'
          description: Why the capture was taken.
      description: One capture cited by a notice or a decision, with the time it was taken.
    Domain.EvidenceId:
      type: string
      format: uuid
      description: Identifier of an evidence record, one per capture.
    Domain.ExternalIdentifier:
      type: object
      required:
        - id
        - trackedTitleId
        - scheme
        - value
        - source
        - retrievedAt
      properties:
        id:
          $ref: '#/components/schemas/Domain.ExternalIdentifierId'
          description: Patrol's own identifier for the row.
        trackedTitleId:
          $ref: '#/components/schemas/Domain.TrackedTitleId'
          description: The tracked title the identifier belongs to.
        scheme:
          $ref: '#/components/schemas/Domain.ExternalIdentifierScheme'
          description: The scheme the value belongs to.
        value:
          type: string
          description: The identifier value in that scheme.
        source:
          $ref: '#/components/schemas/Domain.CatalogueSource'
          description: Where the identifier was read from.
        retrievedAt:
          type: string
          format: date-time
          description: When the identifier was recorded.
      description: An external identifier for a tracked title. A fact, not a lookup key.
    Domain.ExternalIdentifierId:
      type: string
      format: uuid
      description: Identifier of an external identifier row.
    Domain.ExternalIdentifierScheme:
      type: string
      enum:
        - wikidata
        - imdb
        - kinopoisk
      description: The external identifier schemes Patrol accepts.
    Domain.FailedScan:
      type: object
      required:
        - state
        - finishedAt
        - failureReason
      properties:
        state:
          type: string
          enum:
            - failed
          description: The literal state discriminator.
        startedAt:
          type: string
          format: date-time
          description: When the scan started, when it started at all.
        finishedAt:
          type: string
          format: date-time
          description: When the scan failed.
        failureReason:
          $ref: '#/components/schemas/Domain.ScanFailureReason'
          description: Why the scan failed.
        failures:
          type: array
          items:
            $ref: '#/components/schemas/Domain.QueryFailure'
          description: The queries that failed, where there were any.
      description: A scan where no query answered.
    Domain.FailedSubmission:
      type: object
      required:
        - state
        - operatorId
        - failedAt
        - failure
      properties:
        state:
          type: string
          enum:
            - failed
          description: The literal state discriminator.
        operatorId:
          $ref: '#/components/schemas/Domain.OperatorId'
          description: The operator who attempted the filing.
        failedAt:
          type: string
          format: date-time
          description: When the failure was recorded.
        failure:
          $ref: '#/components/schemas/Domain.SubmissionFailure'
          description: The failure and its cause.
      description: A submission that failed to deliver.
    Domain.GroupPriority:
      type: string
      enum:
        - high
        - normal
        - low
      description: The scheduling priority of a title group.
    Domain.Host:
      type: string
      description: A URL's host, or a violation's destination host after redirects. Lowercased DNS name, never a registrable-domain grouping.
    Domain.HostObjection:
      type: object
      required:
        - id
        - host
        - registrableDomain
        - reason
        - source
        - recordedAt
        - affectedCandidateCount
      properties:
        id:
          $ref: '#/components/schemas/Domain.HostObjectionId'
          description: Patrol's own identifier.
        host:
          $ref: '#/components/schemas/Domain.Host'
          description: The host whose captures are suspended.
        registrableDomain:
          $ref: '#/components/schemas/Domain.RegistrableDomain'
          description: The host's registrable domain.
        reason:
          type: string
          description: What the host said, or what Patrol observed, that stopped capture.
        source:
          $ref: '#/components/schemas/Domain.HostObjectionSource'
          description: How the objection reached Patrol.
        recordedAt:
          type: string
          format: date-time
          description: When the objection was recorded.
        recordedBy:
          $ref: '#/components/schemas/Domain.OperatorId'
          description: The operator who recorded the objection, absent when the worker recorded it from a host response.
        affectedCandidateCount:
          type: integer
          format: int32
          minimum: 0
          description: How many candidates on the host were surfaced at the time of the objection.
        clearedAt:
          type: string
          format: date-time
          description: When an operator cleared the objection and reopened the host to capture.
        clearedBy:
          $ref: '#/components/schemas/Domain.OperatorId'
          description: The operator who cleared the objection.
        clearanceReason:
          type: string
          description: Why the objection was cleared.
      description: A recorded objection from a host — a cease-and-desist, a block notice, or an abuse complaint naming Patrol — that suspends every capture of that host until an operator clears it. An objection is never deleted.
    Domain.HostObjectionId:
      type: string
      format: uuid
      description: Identifier of a host objection that suspends captures of one host.
    Domain.HostObjectionSource:
      type: string
      enum:
        - host_contact
        - operator
      description: How a host objection reached Patrol.
    Domain.HostSource:
      type: string
      enum:
        - landing_page
        - submitted_url
      description: Where a violation's host was derived from.
    Domain.IntentPhrase:
      type: object
      required:
        - text
        - version
      properties:
        text:
          type: string
          description: The phrase appended to the display title, in the locale's language.
        version:
          type: integer
          format: int32
          minimum: 1
          description: The version of the phrase at issue time.
      description: An intent phrase an operator can edit, carrying the version a search result was issued under.
    Domain.InterfaceLanguage:
      type: string
      enum:
        - en
        - ru
      description: A language the operator interface ships in.
    Domain.Invitation:
      type: object
      required:
        - id
        - email
        - role
        - invitedBy
        - createdAt
        - expiresAt
      properties:
        id:
          $ref: '#/components/schemas/Domain.InvitationId'
          description: Patrol's own identifier.
        email:
          $ref: '#/components/schemas/Domain.Email'
          description: The invited email address.
        role:
          $ref: '#/components/schemas/Domain.OperatorRole'
          description: The role the account will hold.
        invitedBy:
          $ref: '#/components/schemas/Domain.OperatorId'
          description: The administrator who issued the invitation.
        createdAt:
          type: string
          format: date-time
          description: When the invitation was issued.
        expiresAt:
          type: string
          format: date-time
          description: When the invitation expires.
        acceptedAt:
          type: string
          format: date-time
          description: When the invitation was accepted.
        revokedAt:
          type: string
          format: date-time
          description: When the invitation was revoked before use.
      description: A single-use invitation for a new operator account, valid twenty-four hours.
    Domain.InvitationId:
      type: string
      format: uuid
      description: Identifier of an operator invitation.
    Domain.LegalHold:
      type: object
      required:
        - id
        - reason
        - createdBy
        - createdAt
        - evidenceIds
        - violationIds
        - noticeIds
      properties:
        id:
          $ref: '#/components/schemas/Domain.LegalHoldId'
          description: Patrol's own identifier.
        reason:
          type: string
          description: Why the hold was placed.
        createdBy:
          $ref: '#/components/schemas/Domain.OperatorId'
          description: The operator who placed the hold.
        createdAt:
          type: string
          format: date-time
          description: When the hold was placed.
        evidenceIds:
          type: array
          items:
            $ref: '#/components/schemas/Domain.EvidenceId'
          description: The captures the hold covers.
        violationIds:
          type: array
          items:
            $ref: '#/components/schemas/Domain.ViolationId'
          description: The violations the hold covers.
        noticeIds:
          type: array
          items:
            $ref: '#/components/schemas/Domain.NoticeId'
          description: The notices the hold covers.
        releasedAt:
          type: string
          format: date-time
          description: When the hold was released.
        releasedBy:
          $ref: '#/components/schemas/Domain.OperatorId'
          description: The operator who released the hold.
      description: A recorded restriction that suspends deletion of the evidence it covers until an operator releases it.
    Domain.LegalHoldId:
      type: string
      format: uuid
      description: Identifier of a legal hold.
    Domain.Locale:
      type: string
      description: A BCP 47 language tag with an optional territory, such as ru-RU.
    Domain.NormalizedUrl:
      type: string
      description: 'A URL reduced to the deduplication key: scheme dropped, host lowercased without a leading www, trailing slash trimmed, tracking parameters removed, remaining query parameters sorted, fragment dropped.'
    Domain.Notice:
      type: object
      required:
        - id
        - content
        - createdBy
        - createdAt
        - lifecycle
      properties:
        id:
          $ref: '#/components/schemas/Domain.NoticeId'
          description: Patrol's own identifier.
        content:
          $ref: '#/components/schemas/Domain.NoticeContent'
          description: The notice's contents, frozen by approval.
        createdBy:
          $ref: '#/components/schemas/Domain.OperatorId'
          description: The operator who created the draft.
        createdAt:
          type: string
          format: date-time
          description: When the draft was created.
        lifecycle:
          $ref: '#/components/schemas/Domain.NoticeLifecycle'
          description: The notice's lifecycle state.
      description: The document one recipient receives. It cites one or more violations of exactly one rights holder and is addressed to exactly one recipient.
    Domain.NoticeContent:
      type: object
      required:
        - recipient
        - recipientProfileId
        - channel
        - citedViolations
        - workIdentifications
        - statements
        - resolvedFields
        - templateVersion
      properties:
        recipient:
          $ref: '#/components/schemas/Domain.Recipient'
          description: The one recipient the notice addresses.
        recipientProfileId:
          $ref: '#/components/schemas/Domain.RecipientProfileId'
          description: The recipient profile the notice was composed for.
        channel:
          $ref: '#/components/schemas/Domain.RecipientChannel'
          description: The profile's channel at composition time.
        citedViolations:
          type: array
          items:
            $ref: '#/components/schemas/Domain.CitedViolation'
          description: The violations cited, each pinned to the captures it relies on.
        workIdentifications:
          type: array
          items:
            $ref: '#/components/schemas/Domain.WorkIdentification'
          description: One identification per cited tracked title.
        statements:
          type: array
          items:
            $ref: '#/components/schemas/Domain.NoticeStatement'
          description: The exact text of every required statement.
        resolvedFields:
          type: array
          items:
            $ref: '#/components/schemas/Domain.ResolvedField'
          description: The form-ordered field map the operator will copy from.
        templateVersion:
          type: string
          description: The version of the statement template used.
      description: 'What a notice carries: its recipient binding, citations, work identification, statements, and resolved form fields.'
    Domain.NoticeId:
      type: string
      format: uuid
      description: Identifier of a notice.
    Domain.NoticeLifecycle:
      anyOf:
        - $ref: '#/components/schemas/Domain.DraftNotice'
        - $ref: '#/components/schemas/Domain.ApprovedNotice'
        - $ref: '#/components/schemas/Domain.WithdrawnNotice'
        - $ref: '#/components/schemas/Domain.SupersededNotice'
      description: The notice state machine. Approval freezes the content and snapshots the parties.
    Domain.NoticeState:
      type: string
      enum:
        - draft
        - approved
        - withdrawn
        - superseded
      description: The notice lifecycle states.
    Domain.NoticeStatement:
      type: object
      required:
        - key
        - text
        - templateVersion
      properties:
        key:
          type: string
          description: The statement's key in the recipient's form.
        text:
          type: string
          description: The exact statement text.
        templateVersion:
          type: string
          description: The version of the statement template.
      description: One required statement and the template version it came from.
    Domain.OpenViolation:
      type: object
      required:
        - state
        - openedAt
      properties:
        state:
          type: string
          enum:
            - open
          description: The literal state discriminator.
        openedAt:
          type: string
          format: date-time
          description: When the violation entered the open state; equal to the confirmation time.
      description: A violation believed to be live.
    Domain.Operator:
      type: object
      required:
        - id
        - email
        - role
        - state
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Domain.OperatorId'
          description: Patrol's own identifier.
        email:
          $ref: '#/components/schemas/Domain.Email'
          description: The operator's email address, which is also their sign-in identifier and is unique.
        role:
          $ref: '#/components/schemas/Domain.OperatorRole'
          description: The operator's role.
        state:
          $ref: '#/components/schemas/Domain.OperatorState'
          description: The account's state.
        preferredLanguage:
          $ref: '#/components/schemas/Domain.InterfaceLanguage'
          description: The interface language the operator chose. Absent until the first choice, when the API follows the request's language or English.
        createdAt:
          type: string
          format: date-time
          description: When the account was created, by bootstrap or invitation.
        updatedAt:
          type: string
          format: date-time
          description: When the account was last edited.
        lastSignInAt:
          type: string
          format: date-time
          description: When the operator last signed in successfully.
        totpEnrolledAt:
          type: string
          format: date-time
          description: When the second factor was enrolled.
        disabledAt:
          type: string
          format: date-time
          description: When the account was disabled.
        disabledBy:
          $ref: '#/components/schemas/Domain.OperatorId'
          description: The administrator who disabled the account.
      description: An authenticated human who reviews candidates, approves notices, and makes submissions.
    Domain.OperatorAttestation:
      type: object
      required:
        - attestedAt
        - statementVersion
      properties:
        attestedAt:
          type: string
          format: date-time
          description: When the operator attested.
        statementVersion:
          type: string
          description: The version of the attestation statement the operator agreed to.
      description: An operator's attestation that a notice was filed as presented.
    Domain.OperatorId:
      type: string
      format: uuid
      description: Identifier of an operator account.
    Domain.OperatorRole:
      type: string
      enum:
        - administrator
        - operator
      description: The role an operator account holds.
    Domain.OperatorSession:
      type: object
      required:
        - id
        - operatorId
        - tokenSha256
        - createdAt
        - lastSeenAt
        - absoluteExpiresAt
        - userAgent
      properties:
        id:
          $ref: '#/components/schemas/Domain.SessionId'
          description: Patrol's own identifier.
        operatorId:
          $ref: '#/components/schemas/Domain.OperatorId'
          description: The operator the session belongs to.
        tokenSha256:
          $ref: '#/components/schemas/Domain.Sha256'
          description: The SHA-256 of the session token.
        createdAt:
          type: string
          format: date-time
          description: When the session was created.
        lastSeenAt:
          type: string
          format: date-time
          description: When the session was last seen.
        absoluteExpiresAt:
          type: string
          format: date-time
          description: The session's absolute expiry, seven days after creation.
        revokedAt:
          type: string
          format: date-time
          description: When the session was revoked.
        userAgent:
          type: string
          description: The user agent the session was created under.
        coarseIp:
          type: string
          description: The coarse IP address the session was created from.
      description: A server-side session row. The token itself is never stored, only its hash.
    Domain.OperatorState:
      type: string
      enum:
        - invited
        - active
        - disabled
      description: The state of an operator account.
    Domain.PartialScan:
      type: object
      required:
        - state
        - startedAt
        - finishedAt
        - issuedQueries
        - failures
      properties:
        state:
          type: string
          enum:
            - partial
