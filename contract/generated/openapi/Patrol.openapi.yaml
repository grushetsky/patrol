        - operator
        - administrator
  /auth/sessions/{sessionId}:
    delete:
      operationId: Sessions_revokeSession
      description: Revoke one of the operator's own sessions. Revoking another device requires its identifier from the list.
      parameters:
        - $ref: '#/components/parameters/Http.CsrfToken'
        - name: sessionId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Domain.SessionId'
      responses:
        '204':
          description: A successful write that returns no body.
        '400':
          description: The request body is malformed or fails schema validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.ErrorBody'
        '401':
          description: No valid session, or the credentials offered are wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.ErrorBody'
        '403':
          description: The session is valid but the operator's role does not grant the operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.ErrorBody'
        '404':
          description: The addressed record does not exist, or the session cannot see it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.ErrorBody'
        '409':
          description: The request conflicts with the record's current state or with an existing record.
          content:
            application/json:
              schema:
