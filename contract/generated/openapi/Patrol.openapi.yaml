        - anonymous
  /auth/sign-in:
    post:
      operationId: Authentication_signIn
      description: Check the password and issue a second-factor challenge. Credentials are never accepted without the second factor.
      parameters:
        - $ref: '#/components/parameters/Http.CsrfToken'
      responses:
        '202':
          description: The password was correct and a second factor is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.SecondFactorChallenge'
        '400':
