        updatedAt:
          type: string
          format: date-time
          description: When the rights holder row was last edited.
      description: The legal person on whose behalf Patrol identifies violations and signs notices. Exactly one exists per deployment.
    Domain.RightsHolderId:
      type: string
      format: uuid
      description: Identifier of the single rights holder in the deployment.
    Domain.RightsHolderSnapshot:
      type: object
      required:
        - legalName
        - country
        - address
        - roleMailbox
        - capturedAt
      properties:
        legalName:
          type: string
          description: The legal name rendered in the notice.
        country:
          $ref: '#/components/schemas/Domain.CountryCode'
          description: The country of the rights holder's address.
        address:
          $ref: '#/components/schemas/Domain.PostalAddress'
          description: The rights holder's address.
        roleMailbox:
          $ref: '#/components/schemas/Domain.Email'
          description: The role mailbox rendered as the contact.
        phone:
          type: string
          description: The phone number, where the form asks for one.
        capturedAt:
          type: string
          format: date-time
          description: When the snapshot was taken.
      description: The rights-holder details a notice carries, frozen at approval.
    Domain.RunningScan:
      type: object
      required:
        - state
        - startedAt
      properties:
        state:
          type: string
          enum:
            - running
          description: The literal state discriminator.
        startedAt:
          type: string
          format: date-time
          description: When the scan started.
      description: A scan that is running.
    Domain.Scan:
      type: object
      required:
        - id
        - titleGroupId
        - engine
        - trigger
        - dueDate
        - plannedQueries
        - createdAt
        - lifecycle
      properties:
        id:
          $ref: '#/components/schemas/Domain.ScanId'
          description: Patrol's own identifier.
        titleGroupId:
          $ref: '#/components/schemas/Domain.TitleGroupId'
          description: The title group the scan targets.
        engine:
          $ref: '#/components/schemas/Domain.Engine'
          description: The one engine the scan issues queries against.
        trigger:
          $ref: '#/components/schemas/Domain.ScanTrigger'
          description: Why the scan ran.
        dueDate:
          type: string
          format: date
          description: The UTC date the scan is due on. A scan is idempotent on title group, engine, and due date.
        requestedBy:
          $ref: '#/components/schemas/Domain.OperatorId'
          description: The operator who requested a manual scan or re-check.
        plannedQueries:
          type: integer
          format: int32
          minimum: 0
          description: The number of queries the plan issues. Priced before the scan starts.
        queryPlan:
          $ref: '#/components/schemas/Domain.QueryPlan'
          description: The plan derived when the scan starts. Absent while the scan is queued and before the plan exists.
        createdAt:
          type: string
          format: date-time
          description: When the scan row was created.
        lifecycle:
          $ref: '#/components/schemas/Domain.ScanLifecycle'
          description: The scan's lifecycle state.
      description: One execution of discovery for one title group on one engine.
    Domain.ScanFailureReason:
      type: string
      enum:
        - budget_exhausted
        - route_unavailable
        - provider_error
        - worker_crash
      description: Why a scan did not run, or did not finish cleanly.
    Domain.ScanId:
      type: string
      format: uuid
      description: Identifier of a scan.
    Domain.ScanLifecycle:
      anyOf:
        - $ref: '#/components/schemas/Domain.QueuedScan'
        - $ref: '#/components/schemas/Domain.RunningScan'
        - $ref: '#/components/schemas/Domain.SucceededScan'
        - $ref: '#/components/schemas/Domain.PartialScan'
        - $ref: '#/components/schemas/Domain.FailedScan'
      description: The scan state machine. Each state carries exactly the fields that state can have.
    Domain.ScanState:
      type: string
      enum:
        - queued
        - running
        - succeeded
        - partial
        - failed
      description: The scan lifecycle states.
    Domain.ScanTrigger:
      type: string
      enum:
        - scheduled
        - manual
        - recheck
        - manual_recheck
      description: Why a scan ran when it did.
    Domain.ScoreComponents:
      type: object
      required:
        - titleMatch
        - signals
        - reputation
      properties:
        titleMatch:
          type: number
          format: float
          description: 'The title-match contribution: 0.70 for an exact variant, 0.60 for a partial or slug match, 0 otherwise.'
        signals:
          type: array
          items:
            $ref: '#/components/schemas/Domain.SignalContribution'
          description: The strong signals that contributed.
        reputation:
          type: number
          format: float
          description: The reputation contribution, at most 0.10 and only alongside a strong signal.
      description: The score out of one and the components behind it.
    Domain.ScriptCode:
      type: string
      pattern: ^[A-Z][a-z]{3}$
      description: An ISO 15924 script code, such as Latn or Cyrl.
    Domain.SearchQuery:
      type: object
      required:
        - id
        - trackedTitleId
        - locale
        - kind
        - text
      properties:
        id:
          $ref: '#/components/schemas/Domain.SearchQueryId'
          description: Patrol's own identifier for the query.
        trackedTitleId:
          $ref: '#/components/schemas/Domain.TrackedTitleId'
          description: The tracked title the query was generated for.
        locale:
          $ref: '#/components/schemas/Domain.Locale'
          description: The locale the query was issued in.
        kind:
          $ref: '#/components/schemas/Domain.QueryKind'
          description: Whether the query is a bare variant or a display title plus an intent phrase.
        text:
          type: string
          description: The exact text issued, after any length cap was applied.
        variantId:
          $ref: '#/components/schemas/Domain.TitleVariantId'
          description: The variant the query was generated from, present for a variant query.
        intentPhrase:
          $ref: '#/components/schemas/Domain.IntentPhrase'
          description: The intent phrase appended, present for an intent query.
      description: One query issued inside a scan, generated from a title variant for one tracked title and one locale.
    Domain.SearchQueryId:
      type: string
      format: uuid
      description: Identifier of a search query inside a query plan.
    Domain.SearchResult:
      type: object
      required:
        - id
        - scanId
        - queryId
        - engine
        - url
        - normalizedUrl
        - rank
        - title
        - snippet
        - locale
        - observedAt
        - rawPayloadRef
        - host
        - registrableDomain
      properties:
        id:
          $ref: '#/components/schemas/Domain.SearchResultId'
          description: Patrol's own identifier.
        scanId:
          $ref: '#/components/schemas/Domain.ScanId'
          description: The scan that issued the query.
        queryId:
          $ref: '#/components/schemas/Domain.SearchQueryId'
          description: The query that produced the row.
        engine:
          $ref: '#/components/schemas/Domain.Engine'
          description: The engine that returned the row.
        url:
          $ref: '#/components/schemas/Domain.Url'
          description: The raw URL the engine returned, stored verbatim as provenance.
        normalizedUrl:
          $ref: '#/components/schemas/Domain.NormalizedUrl'
          description: The URL's deduplication key.
        rank:
          type: integer
          format: int32
          minimum: 1
          description: The row's rank in the result set.
        title:
          type: string
          description: The result title as the engine returned it.
        snippet:
          type: string
          description: The result snippet as the engine returned it.
        locale:
          $ref: '#/components/schemas/Domain.Locale'
          description: The locale the query was issued in.
        territory:
          $ref: '#/components/schemas/Domain.Territory'
          description: The territory the query targeted, when one applied.
        observedAt:
          type: string
          format: date-time
          description: When the engine observed the row.
        rawPayloadRef:
          type: string
          description: A reference to the stored vendor response, so the observation can be reproduced without re-querying.
        host:
          $ref: '#/components/schemas/Domain.Host'
          description: The row's host.
        registrableDomain:
          $ref: '#/components/schemas/Domain.RegistrableDomain'
          description: The row's registrable domain.
        candidateId:
          $ref: '#/components/schemas/Domain.CandidateId'
          description: The candidate this row was paired into, when the pair had not been dismissed.
      description: One ranked row returned for a search query. Never edited.
    Domain.SearchResultId:
      type: string
      format: uuid
      description: Identifier of a search result.
    Domain.SessionId:
      type: string
      format: uuid
      description: Identifier of an operator session.
    Domain.Sha256:
      type: string
      pattern: ^[a-f0-9]{64}$
      description: A lowercase hexadecimal SHA-256 digest.
    Domain.SignalContribution:
      type: object
      required:
        - kind
        - value
      properties:
        kind:
          $ref: '#/components/schemas/Domain.SignalKind'
          description: Which signal fired.
        value:
          type: number
          format: float
          description: The score the signal added.
      description: One strong signal and what it added.
    Domain.SignalKind:
      type: string
      enum:
        - player
        - duration
        - download
        - release
        - episodes
      description: A page property that counts as a strong matching signal.
    Domain.Signatory:
      type: object
      required:
        - fullLegalName
        - authorityBasis
        - contactEmail
      properties:
        fullLegalName:
          type: string
          description: The signatory's full legal name, rendered in every signature field.
        authorityBasis:
          type: string
          description: The basis on which the signatory is authorised to act for the rights holder.
        contactEmail:
          $ref: '#/components/schemas/Domain.Email'
          description: The signatory's contact email, snapshotted into a notice at approval.
        contactPhone:
          type: string
          description: The signatory's contact phone, where a form asks for one.
      description: The natural person authorised to sign notices. It holds no credentials and cannot sign in.
    Domain.SignatorySnapshot:
      type: object
      required:
        - fullLegalName
        - authorityBasis
        - contactEmail
        - capturedAt
      properties:
        fullLegalName:
          type: string
          description: The signatory's full legal name, rendered in every signature field.
        authorityBasis:
          type: string
          description: The basis on which the signatory is authorised.
        contactEmail:
          $ref: '#/components/schemas/Domain.Email'
          description: The signatory's contact email.
        contactPhone:
          type: string
          description: The signatory's contact phone.
        capturedAt:
          type: string
          format: date-time
          description: When the snapshot was taken.
      description: The signatory details a notice carries, frozen at approval.
    Domain.Submission:
      type: object
      required:
        - id
        - noticeId
        - channel
        - recipientProfileId
        - packLanguage
        - attemptCount
        - createdAt
        - lifecycle
      properties:
        id:
          $ref: '#/components/schemas/Domain.SubmissionId'
          description: Patrol's own identifier.
        noticeId:
          $ref: '#/components/schemas/Domain.NoticeId'
          description: 'The notice being delivered. Unique: a retry never creates a second delivery.'
        channel:
          $ref: '#/components/schemas/Domain.RecipientChannel'
          description: The channel used.
        recipientProfileId:
          $ref: '#/components/schemas/Domain.RecipientProfileId'
          description: The recipient profile used.
        packLanguage:
          $ref: '#/components/schemas/Domain.InterfaceLanguage'
          description: The language of the operator-facing handoff checklist, frozen from the approving operator at approval.
        attemptCount:
          type: integer
          format: int32
          minimum: 0
          description: How many delivery attempts the operator has made.
        packRef:
          type: string
          description: The content-addressed reference to the frozen handoff pack, once the pack is generated.
        packSha256:
          $ref: '#/components/schemas/Domain.Sha256'
          description: The pack's SHA-256, once the pack is generated.
        createdAt:
          type: string
          format: date-time
          description: When the submission row was created.
        cancelledAt:
          type: string
          format: date-time
          description: When the pending submission was cancelled because its notice was withdrawn or superseded.
        lifecycle:
          $ref: '#/components/schemas/Domain.SubmissionLifecycle'
          description: The submission's lifecycle state.
      description: One delivery attempt of an approved notice through a recipient's channel, performed by an operator. One exists per notice.
    Domain.SubmissionFailure:
      type: object
      required:
        - reason
        - note
        - recordedAt
      properties:
        reason:
          $ref: '#/components/schemas/Domain.SubmissionFailureReason'
          description: Why the submission failed or was refused.
        note:
          type: string
          description: The operator's account of the cause. A rejection requires a review note naming it.
        recordedAt:
          type: string
          format: date-time
          description: When the failure was recorded.
      description: A failed or refused submission and its cause.
    Domain.SubmissionFailureReason:
      type: string
      enum:
        - recipient_error
        - recipient_rejection
        - operator_report
      description: Why a submission failed or was refused.
    Domain.SubmissionId:
      type: string
      format: uuid
      description: Identifier of a submission, one per notice delivery.
    Domain.SubmissionLifecycle:
      anyOf:
        - $ref: '#/components/schemas/Domain.PendingSubmission'
        - $ref: '#/components/schemas/Domain.DeliveredSubmission'
        - $ref: '#/components/schemas/Domain.AcknowledgedSubmission'
        - $ref: '#/components/schemas/Domain.RejectedSubmission'
        - $ref: '#/components/schemas/Domain.FailedSubmission'
      description: The submission state machine.
    Domain.SubmissionState:
      type: string
      enum:
        - pending
        - delivered
        - acknowledged
        - rejected
        - failed
      description: The submission lifecycle states.
    Domain.SubmissionStats:
      type: object
      required:
        - windowSize
        - rejected
        - failed
        - thresholdExceeded
      properties:
        windowSize:
          type: integer
          format: int32
          minimum: 0
          description: How many submissions the window covers, at most twenty.
        rejected:
          type: integer
          format: int32
          minimum: 0
          description: How many were rejected by the recipient.
        failed:
          type: integer
          format: int32
          minimum: 0
          description: How many failed to deliver.
        thresholdExceeded:
          type: boolean
          description: Whether the rejected plus failed share crossed the threshold that pauses scheduled drafting.
      description: The last twenty submissions' outcomes for one recipient profile.
    Domain.SucceededScan:
      type: object
      required:
        - state
        - startedAt
        - finishedAt
        - issuedQueries
      properties:
        state:
          type: string
          enum:
            - succeeded
          description: The literal state discriminator.
        startedAt:
          type: string
          format: date-time
          description: When the scan started.
        finishedAt:
          type: string
          format: date-time
          description: When the scan finished.
        issuedQueries:
          type: integer
          format: int32
          minimum: 0
          description: How many queries were actually issued.
      description: A scan whose every query answered.
    Domain.SupersededNotice:
      type: object
      required:
        - state
        - supersededBy
        - supersededAt
        - supersededByNoticeId
      properties:
        state:
          type: string
          enum:
            - superseded
          description: The literal state discriminator.
        supersededBy:
          $ref: '#/components/schemas/Domain.OperatorId'
          description: The operator who superseded the notice.
        supersededAt:
          type: string
          format: date-time
          description: When the notice was superseded.
        supersededByNoticeId:
          $ref: '#/components/schemas/Domain.NoticeId'
          description: The corrected notice that replaces it.
      description: A notice replaced by a corrected one.
    Domain.Territory:
      type: string
      pattern: ^[A-Z]{2}$
      description: An ISO 3166-1 alpha-2 territory code, uppercase, used where a rule applies to a country rather than a language.
    Domain.TimeZoneId:
      type: string
      description: An IANA time zone identifier, such as Europe/Berlin.
    Domain.TitleGroup:
      type: object
      required:
        - id
        - name
        - locales
        - scanTime
        - priority
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Domain.TitleGroupId'
          description: Patrol's own identifier.
        name:
          type: string
          description: The group's display name.
        locales:
          type: array
          items:
            $ref: '#/components/schemas/Domain.Locale'
          description: The locales the group's scans generate queries for. At least one locale is required.
        scanTime:
          type: string
          format: time
          description: The local time inside the scheduling window at which the group becomes due. The window is 02:00 to 05:59 UTC by default.
        priority:
          $ref: '#/components/schemas/Domain.GroupPriority'
          description: The group's scheduling priority.
        createdAt:
          type: string
          format: date-time
          description: When the group was created.
        updatedAt:
          type: string
          format: date-time
          description: When the group was last edited.
      description: An operator-defined set of tracked titles that share scan settings and allowlist scope.
    Domain.TitleGroupId:
      type: string
      format: uuid
      description: Identifier of an operator-defined title group.
    Domain.TitleProvenance:
      type: object
      required:
        - source
        - enteredBy
        - enteredAt
        - updatedBy
      properties:
        source:
          $ref: '#/components/schemas/Domain.CatalogueSource'
          description: Where the original title, year, and type came from.
        enteredBy:
          $ref: '#/components/schemas/Domain.OperatorId'
          description: The operator who entered the title.
        enteredAt:
          type: string
          format: date-time
          description: When the operator entered the title.
        updatedBy:
          $ref: '#/components/schemas/Domain.OperatorId'
          description: The operator who last edited the title.
      description: Provenance of a tracked title's core facts.
    Domain.TitleType:
      type: string
      enum:
        - film
        - series
        - miniseries
        - other
      description: The kind of work a tracked title is.
    Domain.TitleVariant:
      type: object
      required:
        - id
        - trackedTitleId
        - text
        - normalizedText
        - kind
        - language
        - script
        - source
        - addedBy
        - addedAt
      properties:
        id:
          $ref: '#/components/schemas/Domain.TitleVariantId'
          description: Patrol's own identifier.
        trackedTitleId:
          $ref: '#/components/schemas/Domain.TrackedTitleId'
          description: The tracked title the variant belongs to.
        text:
          type: string
          description: The variant text as the operator entered it. The native string is never overwritten.
        normalizedText:
          type: string
          description: The matching key derived from the text by the normalization rules. Never typed, never displayed.
        kind:
          $ref: '#/components/schemas/Domain.TitleVariantKind'
          description: How the variant relates to the work.
        language:
          $ref: '#/components/schemas/Domain.Locale'
          description: The language tag of the text.
        script:
          $ref: '#/components/schemas/Domain.ScriptCode'
          description: The script the text is written in.
        territory:
          $ref: '#/components/schemas/Domain.Territory'
          description: The territory the variant applies to, when it is territory-specific.
        source:
          $ref: '#/components/schemas/Domain.CatalogueSource'
          description: Where the variant text came from.
        addedBy:
          $ref: '#/components/schemas/Domain.OperatorId'
          description: The operator who added the variant.
        addedAt:
          type: string
          format: date-time
          description: When the variant was added.
      description: A recorded string by which a tracked title is known, typed by kind, language, script, and territory.
    Domain.TitleVariantId:
      type: string
      format: uuid
      description: Identifier of a title variant.
    Domain.TitleVariantKind:
      type: string
      enum:
        - original
        - localized
        - transliterated
        - alternate
      description: How a title variant relates to the work.
    Domain.TrackedTitle:
      type: object
      required:
        - id
        - titleGroupId
        - releaseYear
        - titleType
        - originalVariantId
        - paused
        - provenance
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Domain.TrackedTitleId'
          description: Patrol's own identifier. Never an external identifier.
        titleGroupId:
          $ref: '#/components/schemas/Domain.TitleGroupId'
          description: The one title group the title belongs to.
        releaseYear:
          type: integer
          format: int32
          minimum: 1878
          description: The four-digit year of first release; for a series, the year of the first season's first episode.
        titleType:
          $ref: '#/components/schemas/Domain.TitleType'
          description: The kind of work.
        runtimeMinutes:
          type: integer
          format: int32
          minimum: 1
          description: The runtime in minutes; for a series, the typical episode runtime. Absent when unknown.
        originalVariantId:
          $ref: '#/components/schemas/Domain.TitleVariantId'
          description: The variant whose text is the canonical label and display title. Exactly one variant of the title is original.
        paused:
          type: boolean
          description: Whether scanning is paused for this title. A paused title is excluded from the chart's tracked count.
        mergedIntoTitleId:
          $ref: '#/components/schemas/Domain.TrackedTitleId'
          description: When the title was merged into another, the surviving title. A merged title is archived, never deleted.
        provenance:
          $ref: '#/components/schemas/Domain.TitleProvenance'
          description: Where the original title, year, and type came from, and who entered them.
        createdAt:
          type: string
          format: date-time
          description: When the title was created.
        updatedAt:
          type: string
          format: date-time
          description: When the title was last edited.
      description: A work the rights holder monitors, carrying its original title, release year, title type, runtime, external identifiers, and title variants.
    Domain.TrackedTitleId:
      type: string
      format: uuid
      description: Identifier of a tracked title.
    Domain.Url:
      type: string
      format: uri
      description: An absolute HTTP or HTTPS URL, stored verbatim unless a field says otherwise.
    Domain.VariantSnapshot:
      type: object
      required:
        - id
        - text
        - kind
        - language
        - script
      properties:
        id:
          $ref: '#/components/schemas/Domain.TitleVariantId'
          description: The variant's identifier at observation time.
        text:
          type: string
          description: The variant text.
        kind:
          $ref: '#/components/schemas/Domain.TitleVariantKind'
          description: How the variant relates to the work.
        language:
          $ref: '#/components/schemas/Domain.Locale'
          description: The variant's language.
        script:
          $ref: '#/components/schemas/Domain.ScriptCode'
          description: The variant's script.
        territory:
          $ref: '#/components/schemas/Domain.Territory'
          description: The variant's territory, when it is territory-specific.
      description: The variant fields a candidate needs to explain its match without joining the catalogue.
    Domain.Violation:
      type: object
      required:
        - id
        - trackedTitleId
        - candidateId
        - reviewDecisionId
        - url
        - normalizedUrl
        - host
        - hostSource
        - registrableDomain
        - detectedAt
        - confirmedAt
        - confirmedBy
        - lifecycle
      properties:
        id:
          $ref: '#/components/schemas/Domain.ViolationId'
          description: Patrol's own identifier.
        trackedTitleId:
          $ref: '#/components/schemas/Domain.TrackedTitleId'
          description: The one tracked title the copy is of.
        candidateId:
          $ref: '#/components/schemas/Domain.CandidateId'
          description: The candidate the violation was created from.
        reviewDecisionId:
          $ref: '#/components/schemas/Domain.ReviewDecisionId'
          description: The review decision that confirmed the violation.
        url:
          $ref: '#/components/schemas/Domain.Url'
          description: The URL as it was submitted or surfaced, stored verbatim. A notice names this URL.
        normalizedUrl:
          $ref: '#/components/schemas/Domain.NormalizedUrl'
          description: The URL's deduplication key.
        host:
          $ref: '#/components/schemas/Domain.Host'
          description: The violation's host, taken from the destination.
        hostSource:
          $ref: '#/components/schemas/Domain.HostSource'
          description: Where the host came from, since an unreachable landing page falls back to the submitted host.
        registrableDomain:
          $ref: '#/components/schemas/Domain.RegistrableDomain'
          description: The host's registrable domain, the unit of reputation and reporting.
        detectedAt:
          type: string
          format: date-time
          description: When the pair was first observed.
        confirmedAt:
          type: string
          format: date-time
          description: When an operator confirmed the violation.
        confirmedBy:
          $ref: '#/components/schemas/Domain.OperatorId'
          description: The operator who confirmed the violation.
        predecessorViolationId:
          $ref: '#/components/schemas/Domain.ViolationId'
          description: The earlier violation this one succeeds, when a URL reappeared after removal or closure.
        lifecycle:
          $ref: '#/components/schemas/Domain.ViolationLifecycle'
          description: How the violation currently stands.
      description: A confirmed unauthorized copy of one tracked title, located by the search-result URL that surfaced it and hosted at the landing page it resolves to.
    Domain.ViolationClosureReason:
      type: string
      enum:
        - url_removed
        - operator_closed
      description: Why a violation left the open state.
    Domain.ViolationEvidence:
      type: object
      required:
        - violationId
        - evidenceId
        - role
        - citedAt
      properties:
        violationId:
          $ref: '#/components/schemas/Domain.ViolationId'
          description: The violation citing the capture.
        evidenceId:
          $ref: '#/components/schemas/Domain.EvidenceId'
          description: The capture cited.
        role:
          $ref: '#/components/schemas/Domain.CaptureReason'
          description: Why the capture was taken.
        citedAt:
          type: string
          format: date-time
          description: When the citation was recorded.
      description: The capture a violation cites and the role it plays.
    Domain.ViolationId:
      type: string
      format: uuid
      description: Identifier of a violation.
    Domain.ViolationLifecycle:
      anyOf:
        - $ref: '#/components/schemas/Domain.OpenViolation'
        - $ref: '#/components/schemas/Domain.RemovedViolation'
        - $ref: '#/components/schemas/Domain.ClosedViolation'
      description: The violation state machine. A closed violation is never reopened; a reappearing URL starts a new violation.
    Domain.ViolationState:
      type: string
      enum:
        - open
        - removed
        - closed
      description: The violation lifecycle states.
    Domain.WithdrawnNotice:
      type: object
      required:
        - state
        - withdrawnBy
        - withdrawnAt
      properties:
        state:
          type: string
          enum:
            - withdrawn
          description: The literal state discriminator.
        withdrawnBy:
          $ref: '#/components/schemas/Domain.OperatorId'
          description: The operator who withdrew the notice.
        withdrawnAt:
          type: string
          format: date-time
          description: When the notice was withdrawn.
        reason:
          type: string
          description: Why the notice was withdrawn.
      description: A notice withdrawn before delivery or while its submission was pending.
    Domain.WorkIdentification:
      type: object
      required:
        - trackedTitleId
        - displayTitle
        - releaseYear
        - titleType
      properties:
        trackedTitleId:
          $ref: '#/components/schemas/Domain.TrackedTitleId'
          description: The tracked title cited.
        displayTitle:
          type: string
          description: The display title, which is the original-title variant.
        releaseYear:
          type: integer
          format: int32
          description: The release year.
        titleType:
          $ref: '#/components/schemas/Domain.TitleType'
          description: The kind of work.
        authorizedExampleUrl:
          $ref: '#/components/schemas/Domain.Url'
          description: An authorized example URL, where the form asks for one.
      description: How a cited tracked title is identified to the recipient.
    Http.AcknowledgementRecordRequest:
      type: object
      required:
        - attestation
        - acknowledgement
      properties:
        attestation:
          $ref: '#/components/schemas/Http.SubmissionAttestation'
          description: The operator's attestation that the notice was filed as presented.
        acknowledgement:
          $ref: '#/components/schemas/Http.AcknowledgementRequest'
          description: What the recipient returned.
      description: The operator's acknowledgement recording.
    Http.AcknowledgementRequest:
      anyOf:
        - $ref: '#/components/schemas/Http.GoogleAcknowledgement'
        - $ref: '#/components/schemas/Http.BingAcknowledgement'
        - $ref: '#/components/schemas/Http.YandexAcknowledgement'
      description: What the recipient returned. The variant must match the notice's recipient.
    Http.ActivityEntry:
      type: object
      required:
        - id
        - kind
        - occurredAt
        - summary
      properties:
        id:
          type: string
          description: The event's identifier.
        kind:
          $ref: '#/components/schemas/Http.ActivityKind'
          description: What happened.
        occurredAt:
          type: string
          format: date-time
          description: When it happened.
        summary:
          type: string
          description: A one-line description for the feed.
        scanId:
          $ref: '#/components/schemas/Domain.ScanId'
          description: The scan the event concerns, when it concerns one.
        candidateId:
          $ref: '#/components/schemas/Domain.CandidateId'
          description: The candidate the event concerns, when it concerns one.
        noticeId:
          $ref: '#/components/schemas/Domain.NoticeId'
          description: The notice the event concerns, when it concerns one.
        submissionId:
          $ref: '#/components/schemas/Domain.SubmissionId'
          description: The submission the event concerns, when it concerns one.
      description: One entry in the dashboard's five-item activity feed.
    Http.ActivityKind:
      type: string
      enum:
        - scan_succeeded
        - scan_partial
        - scan_failed
        - review_decision
        - notice_approved
        - submission_acknowledged
      description: The kinds of event the activity feed lists.
    Http.AllowlistEntryPage:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Domain.AllowlistEntry'
          description: The entries on this page.
        total:
          type: integer
          format: int32
          description: How many entries match the filter in total.
        page:
          type: integer
          format: int32
          description: The one-based page number.
        pageSize:
          type: integer
          format: int32
          description: The page size.
      description: A page of allowlist entries.
    Http.AllowlistEntrySummary:
      type: object
      required:
        - id
        - kind
        - value
        - scope
      properties:
        id:
          $ref: '#/components/schemas/Domain.AllowlistEntryId'
          description: The entry's identifier.
        kind:
          $ref: '#/components/schemas/Domain.AllowlistKind'
          description: Why the host or URL prefix is allowed.
        value:
          type: string
          description: The value the entry matches.
        scope:
          $ref: '#/components/schemas/Domain.AllowlistScope'
          description: What the entry covers.
        territory:
          $ref: '#/components/schemas/Domain.Territory'
          description: The territory the entry applies to, when it is territory-specific.
      description: One allowlist entry as a review row shows it.
    Http.ApprovalAttestation:
      type: object
      required:
        - reviewedViolations
        - currentStatements
        - authorizedSignatory
      properties:
        reviewedViolations:
          type: boolean
          enum:
            - true
          description: The operator confirms every cited violation was reviewed.
        currentStatements:
          type: boolean
          enum:
            - true
          description: The operator confirms the statement text is the recipient's current text.
        authorizedSignatory:
          type: boolean
          enum:
            - true
          description: The operator confirms the signatory is authorised to attest for the rights holder.
      description: The three confirmations an approving operator makes. Each must be true.
    Http.ApprovalResult:
      type: object
      required:
        - notice
        - status
        - queuedCaptures
      properties:
        notice:
          $ref: '#/components/schemas/Domain.Notice'
          description: The approved notice.
        status:
          $ref: '#/components/schemas/Http.NoticeStatus'
          description: The derived status after approval.
        queuedCaptures:
          type: integer
          format: int32
          description: How many pre-handoff captures were queued because the newest live capture was older than seven days.
        submission:
          $ref: '#/components/schemas/Domain.Submission'
          description: The delivery attempt, present when every capture had already settled.
      description: 'The result of approving a notice: frozen content, queued captures, and the submission once its captures settle.'
    Http.ArtifactDownloadRef:
      type: object
      required:
        - url
        - expiresAt
        - sha256
        - contentType
      properties:
        url:
          $ref: '#/components/schemas/Domain.Url'
          description: The signed URL to fetch.
        expiresAt:
          type: string
          format: date-time
          description: When the signed URL stops working.
        sha256:
          $ref: '#/components/schemas/Domain.Sha256'
          description: The SHA-256 the returned bytes must match.
        contentType:
          type: string
          description: The artifact's content type.
      description: A short-lived signed reference to one artifact's bytes, pinned to the content hash.
    Http.ArtifactSummary:
      type: object
      required:
        - kind
        - sha256
        - contentType
        - byteSize
        - truncated
      properties:
        kind:
          $ref: '#/components/schemas/Domain.EvidenceArtifactKind'
          description: Which artifact this is.
        sha256:
          $ref: '#/components/schemas/Domain.Sha256'
          description: The SHA-256 of the bytes, which is also the object key.
        contentType:
          type: string
          description: The artifact's content type.
        byteSize:
          type: integer
          format: int32
          description: The artifact's size in bytes.
        width:
          type: integer
          format: int32
          description: The artifact's width, for image artifacts.
        height:
          type: integer
          format: int32
          description: The artifact's height, for image artifacts.
        truncated:
          type: boolean
          description: Whether the artifact was truncated at a ceiling.
      description: One artifact's metadata, keyed by its content hash.
    Http.AuthenticatedSession:
      type: object
      required:
        - operator
        - session
        - csrfToken
      properties:
        operator:
          $ref: '#/components/schemas/Domain.Operator'
          description: The signed-in operator.
        session:
          $ref: '#/components/schemas/Http.SessionView'
          description: The session the cookie names.
        csrfToken:
          type: string
          description: The double-submit token for this session.
        recoveryCodesRemaining:
          type: integer
          format: int32
          description: How many recovery codes remain unused, present after a recovery-code sign-in.
      description: An authenticated operator, the session they hold, and the token their mutations carry.
    Http.BingAcknowledgement:
      type: object
      required:
        - recipient
        - ticketId
        - ticketDetailsUrl
      properties:
        recipient:
          type: string
          enum:
            - bing
          description: The recipient this acknowledgement belongs to.
        ticketId:
          type: string
          description: The TicketId parsed from the ticket-details URL.
        ticketDetailsUrl:
          $ref: '#/components/schemas/Domain.Url'
