  /auth/totp:
    post:
      operationId: Sessions_beginReenrollment
      description: Start re-enrolling the second factor, authorised by the current password and code.
      parameters:
        - $ref: '#/components/parameters/Http.CsrfToken'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.TotpEnrollment'
        '400':
          description: The request body is malformed or fails schema validation.
