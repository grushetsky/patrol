        '503':
          description: The deployment is not bootstrapped, or its schema version does not match the running image.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http.ErrorBody'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Http.PasswordChangeRequest'
      security:
        - ApiKeyAuth: []
      x-patrol-roles:
        - operator
        - administrator
  /auth/preferences:
    patch:
      operationId: Sessions_updatePreferences
      description: Set the interface language for this operator. The choice persists on the account and applies to emails addressed to the operator.
      parameters:
        - $ref: '#/components/parameters/Http.CsrfToken'
      responses:
        '200':
          description: The request has succeeded.
