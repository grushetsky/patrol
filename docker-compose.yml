# Local development topology: PostgreSQL 18, MinIO, the API, the worker, and
# the SSR app (docs/adr/0005, docs/adr/0006, docs/adr/0027). Everything binds
# to loopback only. The migrate task is a one-shot service from the API image
# (ADR 0028): the api and the worker start only after it completed.
name: patrol

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: patrol
      POSTGRES_PASSWORD: patrol
      POSTGRES_DB: patrol
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # postgres:18 moved PGDATA to /var/lib/postgresql/18/docker and
      # expects the mount at /var/lib/postgresql (docker-library/postgres#37);
      # mounting at the old /var/lib/postgresql/data leaves the named volume
      # unused and refuses to boot over pre-18 data.
      - patrol-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patrol -d patrol"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: patrolminio
      MINIO_ROOT_PASSWORD: patrolminio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - patrol-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # One-shot migration runner from the same image as the API (ADR 0028):
  # applies every pending forward-only migration, exits 0, and only then do
  # the api and worker services start.
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://patrol:patrol@db:5432/patrol
    # The tsx loader is required here for the same reason as the API's CMD in
    # docker/Dockerfile.api: the workspace packages ship TypeScript source.
    command: ["node", "--import", "file:///app/apps/api/node_modules/tsx/dist/loader.mjs", "apps/api/dist/db/migrate-cli.js"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://patrol:patrol@db:5432/patrol
      PATROL_OBJECT_STORE_ENDPOINT: http://minio:9000
      PATROL_OBJECT_STORE_ACCESS_KEY: patrolminio
      PATROL_OBJECT_STORE_SECRET_KEY: patrolminio
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # node:26-slim ships neither curl nor wget, so the probe is plain Node.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://patrol:patrol@db:5432/patrol
      PATROL_OBJECT_STORE_ENDPOINT: http://minio:9000
      PATROL_OBJECT_STORE_ACCESS_KEY: patrolminio
      PATROL_OBJECT_STORE_SECRET_KEY: patrolminio
      # The local topology has no provider credentials, so the worker boots
      # with the fixture-driven fake adapter by default — real routes need
      # DATAFORSEO_*/YANDEX_* credentials and this variable unset (or "0").
      PATROL_FAKE_ADAPTER: "1"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Process-alive probe: the worker touches a heartbeat file every 30 s and
    # the check fails once the file is older than 90 s.
    # TODO(slice 9): switch to the queue heartbeat (pg-boss worker state)
    # the deployment topology specifies for the worker.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"try { const s = require('node:fs').statSync(process.env.PATROL_WORKER_HEARTBEAT_FILE ?? '/tmp/patrol-worker-heartbeat'); process.exit(Date.now() - s.mtimeMs < 90_000 ? 0 : 1) } catch { process.exit(1) }\""]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    environment:
      NODE_ENV: production
      # The SSR loader calls the API through the internal compose network;
      # the browser goes through the ALB's same-origin /api instead.
      PATROL_API_INTERNAL_URL: http://api:8080/api
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

volumes:
  patrol-db-data:
  patrol-minio-data:
