name: patrol

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-patrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patrol}
      POSTGRES_DB: ${POSTGRES_DB:-patrol}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-patrol} -d ${POSTGRES_DB:-patrol}"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-patrol}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-patrol-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "apps/api/dist/db/migrate-cli.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-patrol}:${POSTGRES_PASSWORD:-patrol}@postgres:5432/${POSTGRES_DB:-patrol}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-patrol}:${POSTGRES_PASSWORD:-patrol}@postgres:5432/${POSTGRES_DB:-patrol}
      PATROL_SCHEMA_BUNDLE: /app/contract/generated/json-schema/patrol
      PATROL_MIGRATIONS_DIR: /app/apps/api/drizzle
      BUILD_VERSION: ${BUILD_VERSION:-0.1.0}
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      WORKER_PORT: "3001"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3001/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: ${API_URL:-http://api:3000/api}
      API_PROXY: http://api:3000
    ports:
      - "8080:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  minio-data:
