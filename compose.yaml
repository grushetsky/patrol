name: patrol

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-patrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patrol}
      POSTGRES_DB: ${POSTGRES_DB:-patrol}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-patrol} -d ${POSTGRES_DB:-patrol}"]
      interval: 5s
      timeout: 5s
      retries: 12

  s3:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${S3_BUCKET:-patrol-evidence}
      COM_ADOBE_TESTING_S3MOCK_STORE_REGION: eu-central-1
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "9000:9090"
    volumes:
      - s3-data:/s3mockroot

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "apps/api/dist/db/migrate-cli.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-patrol}:${POSTGRES_PASSWORD:-patrol}@postgres:5432/${POSTGRES_DB:-patrol}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-patrol}:${POSTGRES_PASSWORD:-patrol}@postgres:5432/${POSTGRES_DB:-patrol}
      PATROL_SCHEMA_BUNDLE: /app/contract/generated/json-schema/patrol
      PATROL_MIGRATIONS_DIR: /app/apps/api/drizzle
      S3_BUCKET: ${S3_BUCKET:-patrol-evidence}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://s3:9090}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-patrol}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-patrol-secret}
      BUILD_VERSION: ${BUILD_VERSION:-0.1.0}
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      createbuckets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      WORKER_PORT: "3001"
      DATABASE_URL: postgres://${POSTGRES_USER:-patrol}:${POSTGRES_PASSWORD:-patrol}@postgres:5432/${POSTGRES_DB:-patrol}
      S3_BUCKET: ${S3_BUCKET:-patrol-evidence}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://s3:9090}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-patrol}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-patrol-secret}
      S3_OBJECT_LOCK_MODE: ${S3_OBJECT_LOCK_MODE:-}
      DATAFORSEO_LOGIN: ${DATAFORSEO_LOGIN:-}
      DATAFORSEO_PASSWORD: ${DATAFORSEO_PASSWORD:-}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      createbuckets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3001/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  createbuckets:
    image: amazon/aws-cli:2.39.4
    depends_on:
      s3:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-patrol}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-patrol-secret}
      AWS_DEFAULT_REGION: eu-central-1
      S3_BUCKET: ${S3_BUCKET:-patrol-evidence}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until aws --endpoint-url=http://s3:9090 s3api head-bucket --bucket "$$S3_BUCKET" >/dev/null 2>&1; do
          aws --endpoint-url=http://s3:9090 s3api create-bucket --bucket "$$S3_BUCKET" >/dev/null 2>&1 || sleep 1
        done
        aws --endpoint-url=http://s3:9090 s3api put-bucket-versioning --bucket "$$S3_BUCKET" --versioning-configuration Status=Enabled >/dev/null 2>&1 || true

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: ${API_URL:-http://api:3000/api}
      API_PROXY: http://api:3000
    ports:
      - "8080:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  s3-data:
